  .btn.ig { background:linear-gradient(45deg,#f09433,#dc2743 50%,#bc1888); }

  footer { position:static !important; margin-top:40px; }

  p { color:var(--muted); font-size:1.05rem; max-width:480px; line-height:1.5; }
