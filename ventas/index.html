const REGLAS_DEF = "# Reglas de venta del agente de MHAS de Honduras\n\n## Quién eres\nEres el asistente de ventas de MHAS de Honduras por WhatsApp. Atiendes a negocios y personas que compran rollos térmicos y químicos, formas continuas, etiquetas, ribbons, clisés y empaque (stretch film y cinta).\n\n## Cómo escribes\n- Español de Honduras, amable y directo.\n- SIEMPRE de \"usted\", igual en toda la conversación: \"necesita\", \"tiene\", \"le interesa\", \"¿Me confirma…?\". Nunca \"tú\" ni \"vos\" (nada de \"necesitás\", \"tenés\", \"te sirve\").\n- El sistema envía un mensaje de bienvenida automático al iniciar la conversación. No te vuelvas a presentar ni a saludar largo: responde directo a lo que pide.\n- Mensajes cortos, como en WhatsApp: 1 a 4 líneas. Una sola pregunta a la vez.\n- Formato de WhatsApp: para resaltar usa *un asterisco* a cada lado; nada de Markdown (#, **, tablas). Como máximo un emoji por mensaje.\n- No muestres códigos internos de producto (ROL-005, ETQ-004…).\n- Siempre responde algo al cliente; nunca dejes un mensaje sin respuesta.\n\n## Precios y productos\n- Usa SOLO los productos y precios de la lista que te da el sistema. Nunca inventes productos, medidas ni precios.\n- Si piden un producto o medida que no está en la lista: no digas que no lo tenemos. Di que lo vas a consultar con producción para darle precio y disponibilidad, usa consultar_produccion, y ofrécele de una vez las opciones más parecidas de la lista con su precio. Sigue atendiendo tú la conversación.\n- Los precios de la lista incluyen ISV por presentación (caja o rollo). Si te piden precio por unidad, usa el precio unitario sin ISV de la lista y aclara que es \"más ISV\".\n- Muchos productos se venden por unidad (rollos o etiquetas sueltas) o por presentación (caja o rollo completo). Si no queda claro, pregunta cuál prefiere.\n\n## Mayoreo\n- Rollo térmico 80x60: precio especial desde 5 cajas (consultar con asesor).\n- Etiqueta de envío 4x6: precio especial desde 10 rollos (consultar con asesor).\n- Rollos químicos y etiqueta de precio: mínimo de mayoreo por definir (si preguntan, pasa a una persona).\n- No ofrezcas descuentos por tu cuenta. Si piden descuento, pasa a una persona.\n\n## Pago y entrega\n- No damos crédito. Formas de pago: transferencia (por defecto), efectivo, contra entrega, cheque, tarjeta o link de pago.\n- En San Pedro Sula: entrega en 1 día.\n- Fuera de San Pedro Sula (incluidas Choloma, La Lima, Villanueva y el resto del país): de 2 a 3 días, por servicio de paquetería; el envío lo paga el cliente al recibir.\n- No des costos de envío: si preguntan cuánto cuesta, di que depende de la paquetería y se paga al recibir; un asesor le puede confirmar.\n\n## Cotizaciones\n- Para cotizar solo necesitas: productos y cantidades, y nombre o empresa.\n- La forma de pago es *Transferencia* por defecto. No la preguntes: menciónala en el resumen y aclara que si prefiere otra le avise. Si no dice nada, queda Transferencia.\n- RTN y dirección son OPCIONALES. Ofrécelos en el mismo mensaje en que pides el nombre o empresa: \"¿Me confirma su nombre o empresa? Si desea la factura con RTN o la entrega a domicilio, me comparte también el RTN y la dirección (es opcional).\"\n- Si el cliente no los da, dice que no, responde otra cosa o solo da algunos, NO los vuelvas a pedir: sigue con lo que tengas.\n- Antes de crear la cotización, resume en pocas líneas: productos, cantidades, total con ISV y \"Pago por transferencia (si prefiere otra forma, me avisa)\". Luego pregunta \"¿Se la preparo así?\".\n- Cuando confirme, usa crear_cotizacion. Si el resultado dice que el PDF se envió, dile el número de cotización y que ya se lo envió por este chat; si no, dile el número y que un asesor se lo envía en breve. Luego indícale que un asesor coordinará la entrega y el pago.\n\n## Cuándo pasar a una persona (herramienta pasar_a_persona)\n- Después de crear la cotización, si quiere pagar o coordinar la entrega ya.\n- Pide descuento, crédito, factura especial o etiquetas personalizadas (diseño, logo).\n- Reclamo, molestia o problema con un pedido.\n- Pide hablar con una persona.\n- No estás seguro de la respuesta.\nAl pasarla, dile al cliente que un asesor le responde en breve por este mismo chat.\n";

function iniciales(){
  const c = String(S.me.ini || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
  if (c) return c;
  const n = (S.me.nombre || "").split(/\s+/).filter(Boolean);

  return g.normalize("NFD").replace(/[^A-Za-z0-9]/g, "").toUpperCase().slice(0, 4) || "MH";
}
const FORMAS = ["Efectivo", "Contra entrega", "Cheque", "Transferencia", "Tarjeta", "Link de pago"];
const FORMA_TXT = {"Efectivo": "Pago en efectivo", "Contra entrega": "Pago contra entrega", "Cheque": "Pago con cheque", "Transferencia": "Pago con transferencia", "Tarjeta": "Pago con tarjeta", "Link de pago": "Pago con link de pago"};
const formaTxt = f => FORMA_TXT[f] || f || "";
const sinIsv = p => r2((Number(p) || 0) / 1.15);
const LU = n => "L. " + (Number(n) || 0).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: Math.abs(n) < 1 ? 4 : 2});
const SEEDMAP = Object.fromEntries(SEED.map(p => [p.id, p]));
const uni = p => Math.max(1, Number(p.unidades) || Number((SEEDMAP[p.id] || {}).unidades) || 1);
const unidadDe = p => p.unidad || (SEEDMAP[p.id] || {}).unidad || "unidad";
const soloPres = p => p.soloPresentacion != null ? !!p.soloPresentacion : unidadDe(p) === "etiqueta";
const codDe = p => p.codigo || (SEEDMAP[p.id] || {}).codigo || "";
const PREF = {"Rollos": "ROL", "Etiquetas": "ETQ", "Formas continuas": "FOR", "Impresión de etiquetas": "IMP", "Stretch film y cinta": "EMP"};
function sugerirCodigo(cat){
  const p = PREF[cat] || (String(cat || "OTR").normalize("NFD").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase() || "OTR");
  const max = S.prod.map(codDe).filter(c => c.startsWith(p + "-")).map(c => Number(c.split("-")[1]) || 0).reduce((a, b) => Math.max(a, b), 0);
  return p + "-" + String(max + 1).padStart(3, "0");
}
const presDe = p => p.presentacion || (SEEDMAP[p.id] || {}).presentacion || "";
const plural = (n, u) => n === 1 ? u : (u === "clisé" ? "clisés" : u + "s");
function calc(items){
  const lines = (items || []).map(i => {
    const u = (Number(i.precio) || 0) / 1.15, bruto = r2(u * i.cant);
    const desc = Math.min(bruto, Math.max(0, r2(i.desc)));
    const imp = r2(bruto - desc);
    return {u, bruto, desc, pct: bruto ? Math.round(desc / bruto * 1000) / 10 : 0, imp, un: i.cant ? imp / i.cant : 0,
      conIsv: r2(i.cant * (Number(i.precio) || 0) - desc * 1.15)};
  });
  const sub = r2(lines.reduce((a, l) => a + l.bruto, 0));
  const desc = r2(lines.reduce((a, l) => a + l.desc, 0));
  const total = r2(lines.reduce((a, l) => a + l.conIsv, 0));
  const base = r2(sub - desc);
  const unidades = (items || []).reduce((a, i) => a + (Number(i.cant) || 0), 0);
  return {lines, sub, desc, base, isv: r2(total - base), total, unidades, n: lines.length};
}
const pctTxt = p => (Number.isInteger(p) ? p : p.toFixed(1)) + "%";
const pagado = c => r2((c.pagos || []).reduce((a, p) => a + (Number(p.monto) || 0), 0));
const saldo = c => r2((Number(c.total ?? c.monto) || 0) - pagado(c));
function estadoPago(x, cobro){
  if (saldo(x) <= 0.005) return [cobro ? "Finalizada" : "Pagada", "b-ok"];
  if (cobro) { const d = x.vence ? diffDays(today(), x.vence) : 0; return d > 0 ? ["Espera de pago · " + d + (d === 1 ? " día" : " días"), d > 7 ? "b-bad" : "b-warn"] : ["Espera de pago", "b-warn"]; }
  if (x.vence && diffDays(today(), x.vence) > 0) return [diffDays(today(), x.vence) + " días vencida", "b-bad"];
  if (x.vence) { const d = diffDays(x.vence, today()); return [d === 0 ? "Vence hoy" : "Vence en " + d + " días", "b-warn"]; }
  return ["Pendiente", "b-warn"];
}

function vCotizaciones(){
  const F = {cotizada: "Abiertas", aprobada: "Por facturar", debe: "Espera de pago", fin: "Finalizadas", anulada: "Anuladas", todas: "Todas"};
  if (S.admin) F.eliminadas = "Eliminadas";
  if (!F[S.filtro]) S.filtro = puede("admin", "facturador") ? "aprobada" : "cotizada";
  const q = clean(S.f.bq).toLowerCase();
  const vivas = S.cot.filter(c => !c.eliminada);
  const cuenta = {cotizada: vivas.filter(c => c.estado === "cotizada").length, aprobada: vivas.filter(c => c.estado === "aprobada").length,
    debe: vivas.filter(c => c.estado === "facturada" && saldo(c) > 0.005).length};
  let list = S.cot.filter(c => {
    if (S.filtro === "eliminadas") return !!c.eliminada;
    if (c.eliminada) return false;
    switch (S.filtro) {
      case "debe": return c.estado === "facturada" && saldo(c) > 0.005;
      case "fin": return c.estado === "facturada" && saldo(c) <= 0.005;

/* ---------- vista: clientes ---------- */
function statsCliente(c){
  const cs = S.cot.filter(x => !x.eliminada && x.cliente && (x.cliente.id === c.id));
  const fac = cs.filter(x => x.estado === "facturada");
  const pedidos = cs.filter(x => x.estado === "aprobada" || x.estado === "facturada")
    .map(x => ({f: (x.factura && x.factura.fecha) || x.fecha, x})).sort((a, b) => a.f.localeCompare(b.f));
  const ult = pedidos.at(-1) || null;
  let ciclo = Number(c.cicloDias) || 0, auto = false;
  if (!ciclo && pedidos.length >= 2) {
    const gaps = []; for (let k = 1; k < pedidos.length; k++) gaps.push(diffDays(pedidos.at(k).f, pedidos.at(k - 1).f));
    const g = gaps.filter(d => d > 0); if (g.length) { ciclo = Math.round(g.reduce((a, b) => a + b, 0) / g.length); auto = true; }
  }
  if (!ciclo && ult) { ciclo = 30; auto = true; }
  const prox = ult ? addDays(ult.f, ciclo) : "";
  const falta = prox ? diffDays(prox, today()) : null;
  const primera = cs.slice().sort((a, b) => (a.creado || 0) - (b.creado || 0))[0];
  return {n: cs.length, pedidos: pedidos.length, facturado: r2(fac.reduce((a, x) => a + (Number(x.total) || 0), 0)), saldo: r2(fac.reduce((a, x) => a + Math.max(0, saldo(x)), 0)),
    ultFecha: ult ? ult.f : "", ultItems: ult ? (ult.x.items || []).map(i => i.cant + " " + i.nombre).join(" · ") : "", ultCot: ult ? ult.x : null,
    ciclo, auto, prox, falta, creadoPor: c.creadoPorNombre || (S.usuarios.find(u => u.id === c.creadoPor) || {}).nombre || (primera && primera.vendedorNombre) || ""};
}
let migrando = false;
function migrarClientes(){
  if (migrando) return;
  const sin = S.cli.filter(c => !c.asignado);
  if (!sin.length) return;
  migrando = true;
  setTimeout(async () => {
    try {
      const b = writeBatch(db); let n = 0;
      S.cli.filter(c => !c.asignado).forEach(c => {
        const prim = S.cot.filter(x => x.cliente && x.cliente.id === c.id).sort((a, z) => (a.creado || 0) - (z.creado || 0))[0];
        const dueno = c.creadoPor || (prim && prim.vendedor) || S.me.uid;
        b.update(doc(db, "clientes", c.id), {asignado: dueno}); n++;
      });
      if (n) await b.commit();
    } catch (e) { console.error(e); }
    migrando = false;
  }, 2500);
}

/* ---------- modal ---------- */

  const md = $("#modal");

}

function mCot(){
  const c = S.cot.find(x => x.id === S.m.id);
  if (!c) return "";
  const [et, ec] = ESTADO[c.estado] || [c.estado, ""];
  const r = rol(), mio = c.vendedor === S.me.uid, fact = puede("admin", "facturador");
  const abierta = c.estado === "cotizada" && !c.eliminada && (fact || mio);
  const mode = S.m.mode, cc = calc(c.items), full = fact;
  let extra = "";
  if (mode === "factura") {
    const fp = S.f.fac_fp || c.formaPago || "Efectivo";
    extra = `<hr class="sep"><h2>Registrar factura</h2>
    ${cc.desc > 0 ? `<div class="panel" style="border-color:var(--gold);padding:12px"><b>Esta cotización tiene descuento.</b><div class="totals" style="max-width:none">${totalsHtml(cc)}</div></div>` : ""}
    <p class="note">Emite la factura con estos mismos productos y precios, y copia aquí el número.</p>
    <div class="row">
      <div class="field" style="flex:2 1 220px"><label for="fn">N.º de factura (SAR)</label><input id="fn" data-k="fac_num" value="${fv("fac_num")}" placeholder="000-001-01-00000001"></div>
      <div class="field"><label for="ff">Fecha</label><input id="ff" type="date" data-k="fac_fecha" value="${esc(S.f.fac_fecha || today())}"></div>
    </div>
    <div class="field"><label for="fp">Forma de pago</label><select id="fp" data-k="fac_fp">${FORMAS.map(f => `<option value="${f}" ${fp === f ? "selected" : ""}>${formaTxt(f)}</option>`).join("")}</select></div>
    <label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink)"><input type="checkbox" style="width:20px;min-height:20px" data-k="fac_pagado" ${(S.f.fac_pagado ?? (fp !== "Contra entrega")) ? "checked" : ""}> Ya pagó el total (queda finalizada)</label>
    <div class="actions"><button class="btn pri" data-a="saveFac" ${S.busy ? "disabled" : ""}>Guardar factura</button><button class="btn" data-a="modeVer">Cancelar</button></div>`;
  } else if (mode === "pago") extra = pagoForm(c, "savePag");
  const ep = c.estado === "facturada" ? estadoPago(c, true) : null;
  let estadoNota = "";
  if (c.estado === "aprobada") estadoNota = r === "vendedor" ? "Enviada a facturar" + (c.aprobada ? " el " + fdate(ymd(new Date(c.aprobada))) : "") + ". Ya no se puede editar." : "El cliente confirmó. Pendiente de facturar.";
  // botones de abajo según estado y rol
  let abajo = [];
  if (abierta) abajo = [`<button class="btn" data-a="editar">Editar</button>`, `<button class="btn pri" data-a="aprobar">Enviar a facturar</button>`, `<button class="btn danger" data-a="anular">Anular</button>`];
  else if (c.estado === "aprobada" && fact && !c.eliminada) abajo = [`<button class="btn pri" data-a="modeFac">Registrar factura</button>`, `<button class="btn" data-a="devolver">Devolver al vendedor</button>`, `<button class="btn danger" data-a="anular">Anular</button>`];
  else if (c.estado === "facturada" && saldo(c) > 0.005 && fact && !c.eliminada) abajo = [`<button class="btn pri" data-a="modePag">Registrar pago</button>`];
  if (S.admin && !c.eliminada) abajo.push(S.m.mas ? `<button class="btn danger" data-a="eliminar">Eliminar</button>` : `<button class="btn" data-a="mas">Más…</button>`);
  return `
  <div class="bigstub">${esc(c.numero)}</div>
  ${c.eliminada ? `<p class="note" style="color:var(--bad);font-weight:600">Eliminada el ${fdate(ymd(new Date(c.eliminadaEn || Date.now())))}. No aparece en listas ni reportes.</p>
    ${S.admin ? `<div class="actions" style="margin-top:6px"><button class="btn pri" data-a="restaurar">Restaurar</button><button class="btn danger" data-a="borrarDef">Borrar para siempre</button></div>` : ""}` : ""}
  <div style="margin-top:8px"><span class="badge ${ec}">${et}</span>${ep ? ` <span class="badge ${ep[1]}">${ep[0]}</span>` : ""}${c.estado === "cotizada" && c.enviada ? ` <span class="badge">Enviada ${fdate(ymd(new Date(c.enviada)))}</span>` : ""}${full && cc.desc > 0 ? ` <span class="badge b-warn">${descTxt(c)}</span>` : ""}</div>
  ${estadoNota ? `<p class="note" style="margin-top:8px">${estadoNota}</p>` : ""}
  <dl class="kv">
    <dt>Cliente</dt><dd>${esc(c.cliente && c.cliente.nombre)}${c.cliente && c.cliente.rtn ? " · RTN " + esc(c.cliente.rtn) : ""}</dd>
    ${c.cliente && c.cliente.direccion ? `<dt>Dirección</dt><dd>${esc(c.cliente.direccion)}</dd>` : ""}
    ${c.cliente && c.cliente.tel ? `<dt>WhatsApp</dt><dd>${esc(c.cliente.tel)}</dd>` : ""}
    ${c.cliente && c.cliente.email ? `<dt>Correo</dt><dd>${esc(c.cliente.email)}</dd>` : ""}
    <dt>Fecha</dt><dd>${fdate(c.fecha)} · válida hasta ${fdate(addDays(c.fecha, c.validez || 15))}</dd>
    <dt>Vendedor</dt><dd>${esc(c.vendedorNombre || "")}</dd>
    ${full && c.formaPago ? `<dt>Forma de pago</dt><dd>${esc(formaTxt(c.formaPago))}</dd>` : ""}
    ${c.factura ? `<dt>Factura</dt><dd>${esc(c.factura.numero)} · ${fdate(c.factura.fecha)}</dd>` : ""}
  </dl>
  ${full ? `<div class="scroll"><table><thead><tr><th class="num">Cant.</th><th>Producto</th><th class="num">Precio unit.</th><th class="num">Descuento</th><th class="num">Importe</th></tr></thead><tbody>
    ${(c.items || []).map((i, n) => { const l = cc.lines[n]; return `<tr><td class="num">${i.cant}</td><td>${esc(i.nombre)}</td><td class="num">${LU(l.u)}</td><td class="num">${l.desc ? L(l.desc) + ` <small class="muted">(${pctTxt(l.pct)})</small>` : "—"}</td><td class="num">${L(l.imp)}</td></tr>`; }).join("")}
  </tbody></table></div>`
  : `<div class="scroll"><table><thead><tr><th class="num">Cant.</th><th>Producto</th><th class="num">Precio unit.</th><th class="num">Total</th></tr></thead><tbody>
    ${(c.items || []).map((i, n) => { const l = cc.lines[n]; return `<tr><td class="num">${i.cant}</td><td>${esc(i.nombre)}</td><td class="num">${LU(l.un)}</td><td class="num">${L(l.imp)}</td></tr>`; }).join("")}
  </tbody></table></div>`}
  <p class="note">Precios sin ISV.</p>
  <div class="totals">${totalsHtml(cc, !full)}${c.estado === "facturada" ? `<div><span class="muted">Pagado</span><span>${L(pagado(c))}</span></div><div><b>Saldo</b><b>${L(saldo(c))}</b></div>` : ""}</div>
  ${c.notas ? `<p class="note">${esc(c.notas)}</p>` : ""}
  ${pagosHtml(c)}
  ${extra}
  ${mode === "ver" ? `<div class="actions">
    ${window.jspdf ? `<button class="btn" data-a="share">Compartir PDF</button><button class="btn" data-a="pdf">Descargar PDF</button>` : ""}
    <a class="btn" data-a="waTxt" href="${esc(waLink(c))}" target="_blank" rel="noopener">Enviar texto</a>
    ${full && window.jspdf ? `<button class="btn" data-a="pdfInterno">PDF interno</button>` : ""}
  </div>
  ${abajo.length ? `<div class="actions">${abajo.join("")}</div>` : ""}` : ""}`;
}
function mProd(){

  <div class="row">
    <div class="field"><label for="pe_unidad">Se vende por</label><input id="pe_unidad" data-k="pe_unidad" list="unids" value="${esc(g("unidad", p.id ? unidadDe(p) : "unidad"))}" placeholder="rollo, etiqueta, caja…">
      <datalist id="unids">${["rollo", "etiqueta", "caja", "unidad", "clisé", "paquete"].map(u => `<option value="${u}">`).join("")}</datalist></div>
    <div class="field"><label for="pe_pres">Presentación</label><input id="pe_pres" data-k="pe_pres" value="${esc(g("pres", p.id ? presDe(p) : ""))}" placeholder="Caja de 50, Rollo de 500…"></div>
  </div>

  ${adm ? `<label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink);margin-top:6px"><input type="checkbox" style="width:20px;min-height:20px" data-k="pe_activo" ${g("activo", p.activo !== false) ? "checked" : ""}> Activo (aparece al cotizar)</label>` : `<p class="note">El producto queda disponible para cotizar de inmediato. Solo el administrador puede modificarlo después.</p>`}

function armarPdf(c, interno){
  const e = emp(), {jsPDF} = window.jspdf;
  const d = new jsPDF({unit: "mm", format: "letter"});
  const W = 215.9, M = 18, cx = W / 2, IW = W - 2 * M;
  const NAVY = [31, 56, 100], INK = [30, 30, 30], GRAY = [105, 110, 120], LINE = [205, 210, 220], YEL = [255, 248, 222], LAB = [232, 235, 242];
  const tc = a => d.setTextColor(a[0], a[1], a[2]), fc = a => d.setFillColor(a[0], a[1], a[2]), dc = a => d.setDrawColor(a[0], a[1], a[2]);
  const cc = calc(c.items), hasD = !!interno && cc.desc > 0;
  const v = c.vendedorInfo || {nombre: c.vendedorNombre || ""};
  try { d.addImage(LOGO, "JPEG", M, 20, 30, 14.8); } catch (_) {}
  if (interno) { d.setFont("helvetica", "bold"); d.setFontSize(8.5); d.setTextColor(180, 35, 24); d.text("COPIA INTERNA", W - M, 14, {align: "right"}); }
  d.setFont("helvetica", "bold"); d.setFontSize(16); tc(NAVY); d.text(e.nombre, cx + 6, 28, {align: "center"});
  d.setFont("helvetica", "normal"); d.setFontSize(9.5); tc(GRAY);
  let y = 34;
  [e.rtn ? "RTN: " + e.rtn : "", e.direccion, [e.pbx ? "PBX " + e.pbx : "", e.whatsapp ? "WhatsApp " + e.whatsapp : "", e.correo].filter(Boolean).join("  ·  ")]
    .filter(Boolean).forEach(t => { d.text(t, cx + 6, y, {align: "center"}); y += 5; });
  y += 6;
  const half = IW / 2, rh = 6.2;
  dc(LINE); d.setLineWidth(0.2);
  [["COTIZACIÓN #", c.numero], ["FECHA", fdate(c.fecha)]].forEach(([k, val]) => {
    fc(LAB); d.rect(M, y, half, rh, "FD"); fc(YEL); d.rect(M + half, y, half, rh, "FD");
    d.setFont("helvetica", "bold"); d.setFontSize(9.5); tc(GRAY); d.text(k, M + 1.5, y + 4.3);
    d.setFont("helvetica", "normal"); tc(INK); d.text(String(val), M + IW - 1.5, y + 4.3, {align: "right"}); y += rh;
  });
  y += 6;
  const cl = c.cliente || {};
  [["Cliente:", cl.nombre], ["Dirección:", cl.direccion], ["RTN:", cl.rtn]].forEach(([k, val]) => {
    fc(YEL); d.rect(M + half, y, half, 5.6, "F");
    d.setFont("helvetica", "bold"); d.setFontSize(9.5); tc(INK); d.text(k, M, y + 4);
    d.setFont("helvetica", "normal"); d.text(d.splitTextToSize(String(val || ""), half - 3)[0] || "", M + half + 1.5, y + 4); y += 5.6;
  });
  y += 6;
  // columnas
  const wC = 18, wP = 31, wT = 31, wD = hasD ? 27 : 0, wN = IW - wC - wP - wT - wD;
  const xs = [M, M + wC, M + wC + wN, M + wC + wN + wP, M + wC + wN + wP + wD];
  const heads = ["CANT.", "PRODUCTO", "PRECIO UNIT."].concat(hasD ? ["DESCUENTO"] : []).concat(["TOTAL"]);
  const widths = [wC, wN, wP].concat(hasD ? [wD] : []).concat([wT]);
  const header = () => {
    fc(NAVY); d.rect(M, y, IW, 6.6, "F"); d.setFont("helvetica", "bold"); d.setFontSize(9.5); d.setTextColor(255, 255, 255);
    let x = M; heads.forEach((h, i) => { d.text(h, x + widths[i] / 2, y + 4.6, {align: "center"}); x += widths[i]; }); y += 6.6;
  };
  header();
  d.setFont("helvetica", "normal"); d.setFontSize(9.5);
  const filas = Math.max((c.items || []).length, 12);
  for (let r = 0; r < filas; r++) {
    const it = (c.items || [])[r], l = it ? cc.lines[r] : null;
    const nl = it ? d.splitTextToSize(it.nombre, wN - 3) : [""];
    const h = Math.max(5.8, nl.length * 4.2 + 1.6);
    if (y + h > 240) { d.addPage(); y = 20; header(); d.setFont("helvetica", "normal"); d.setFontSize(9.5); }
    fc(YEL); d.rect(M, y, wC + wN, h, "F"); dc(LINE);
    let x = M; widths.forEach(w => { d.rect(x, y, w, h); x += w; });
    if (it) {
      tc(INK);
      d.text(String(it.cant), M + wC / 2, y + 4.1, {align: "center"});
      d.text(nl, M + wC + 1.5, y + 4.1);
      d.text(LU(interno ? l.u : l.un), xs[2] + wP / 2, y + 4.1, {align: "center"});
      if (hasD) d.text(l.desc ? L(l.desc) + " (" + pctTxt(l.pct) + ")" : "", xs[3] + wD / 2, y + 4.1, {align: "center"});
      d.text(L(l.imp), M + IW - wT / 2, y + 4.1, {align: "center"});
    }
    y += h;
  }
  const tot = [["Subtotal", L(hasD ? cc.sub : cc.base)]].concat(hasD ? [["Descuento", "- " + L(cc.desc)], ["Subtotal con descuento", L(cc.base)]] : []).concat([["ISV (15%)", L(cc.isv)]]);
  if (y + tot.length * 6 + 70 > 270) { d.addPage(); y = 20; }
  tot.forEach(([k, val]) => {
    dc(LINE); d.rect(M, y, IW - wT, 6); d.rect(M + IW - wT, y, wT, 6);
    d.setFont("helvetica", "bold"); tc(INK); d.text(k, M + IW - wT - 1.5, y + 4.2, {align: "right"});
    d.setFont("helvetica", "normal"); d.text(val, M + IW - wT / 2, y + 4.2, {align: "center"}); y += 6;
  });
  fc(NAVY); d.rect(M, y, IW, 6.6, "F"); d.setDrawColor(255, 255, 255); d.line(M + IW - wT, y, M + IW - wT, y + 6.6);
  d.setFont("helvetica", "bold"); d.setTextColor(255, 255, 255);
  d.text("TOTAL", M + IW - wT - 1.5, y + 4.6, {align: "right"}); d.text(L(cc.total), M + IW - wT / 2, y + 4.6, {align: "center"});
  y += 6.6 + 7;
  const items = [["Tiempo de entrega:", e.entrega], ["Envío:", e.envio],
    ["Condiciones:", formaTxt(c.formaPago || "Efectivo")],
    ["Validez:", "Esta cotización es válida por " + (c.validez || e.validez) + " días a partir de la fecha."]];
  if (clean(c.notas)) items.push(["Nota:", clean(c.notas)]);
  d.setFontSize(8.5);
  const lab = Math.max(...items.map(([k]) => { d.setFont("helvetica", "bold"); return d.getTextWidth(k); })) + 2;
  d.setFont("helvetica", "normal");
  const filasN = items.map(([k, t]) => [k, String(t).split(/\r?\n/).flatMap(par => d.splitTextToSize(par, IW - 4 - lab))]);
  const nh = 9 + filasN.reduce((a, [, ls]) => a + ls.length, 0) * 3.9 + 3;
  if (y + nh + 30 > 272) { d.addPage(); y = 20; }
  fc([243, 244, 246]); d.rect(M, y, IW, nh, "F"); dc([170, 175, 185]); d.line(M, y, M, y + nh);
  tc(INK); d.setFont("helvetica", "bold"); d.text("NOTAS", M + 1.5, y + 4.5);
  let ny = y + 9;
  filasN.forEach(([k, ls]) => {
    d.setFont("helvetica", "bold"); d.text(k, M + 1.5, ny);
    d.setFont("helvetica", "normal"); d.text(ls, M + 1.5 + lab, ny);
    ny += ls.length * 3.9;
  });
  y += nh + 16;
  dc(INK); d.line(M, y, M + 68, y); y += 5.5;
  d.setFont("helvetica", "bold"); d.setFontSize(10.5); tc(INK); d.text(v.nombre || "", M, y); y += 5.5;
  d.setFont("helvetica", "normal"); d.setFontSize(9.5); tc(GRAY);
  d.text([v.cargo, v.tel ? "Tel. " + v.tel : "", v.correo].filter(Boolean).join("  ·  "), M, y);
  return d;
}
function nombrePdf(c){ return "Cotizacion " + c.numero + " - " + String((c.cliente && c.cliente.nombre) || "").replace(/[\\/:*?"<>|]+/g, "").slice(0, 40) + ".pdf"; }

async function compartirPdf(c){

  const d = armarPdf(c), name = nombrePdf(c);

  if (fact) dataSubs.push(onSnapshot(collection(db, "cxp"), q => { S.cxp = mapDocs(q); render(); }, onErr));

/* ---------- correlativo ---------- */
async function siguienteNumero(ini){
  const ref = doc(db, "contadores", ini);
  const n = await runTransaction(db, async tx => {
    const s = await tx.get(ref);
    const n = (s.exists() ? Number(s.data().ultimo) || 0 : 0) + 1;
    tx.set(ref, {ultimo: n});
    return n;
  });
  return "COT-" + ini + "-" + String(n).padStart(4, "0");
}

      .concat(S.cli.slice().sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "")).map(c => { const st = statsCliente(c);
        return [c.nombre, c.rtn, c.direccion, c.tel, c.email, st.creadoPor, c.creado ? fdate(ymd(new Date(c.creado))) : "", st.pedidos, fdate(st.ultFecha), st.ultItems,
          st.ultFecha ? st.ciclo : "", fdate(st.prox), st.facturado.toFixed(2), st.saldo.toFixed(2)]; }));
    const blob = new Blob(["\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n")], {type: "text/csv;charset=utf-8"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "clientes-mhas-" + today() + ".csv";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },
  userEdit(v){ Object.keys(S.f).filter(k => k.startsWith("ue_")).forEach(k => delete S.f[k]); S.m = {type: "user", id: v}; draw(); },
  async userSave(){
    const u = S.usuarios.find(x => x.id === S.m.id) || {id: S.m.id};
    const g = (k, d) => S.f["ue_" + k] ?? d, yo = u.id === S.me.uid;
    const data = {nombre: clean(g("nombre", u.nombre)), cargo: clean(g("cargo", u.cargo || "Ventas")), tel: clean(g("tel", u.tel)),
      correo: clean(g("correo", u.correo || u.email)), ini: String(g("ini", u.ini || "")).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4)};
    if (!yo) data.rol = g("rol", u.rol || "");
    if (!data.nombre) return toast("Escribe el nombre.");
    if (await upd(doc(db, "usuarios", u.id), data, "Datos guardados", true)) { Object.keys(S.f).filter(k => k.startsWith("ue_")).forEach(k => delete S.f[k]); S.m = null; draw(); }
  },
  prodNuevo(){ clearProd(); S.m = {type: "prod", id: null}; draw(); },
  prodEdit(v){ clearProd(); S.m = {type: "prod", id: v}; draw(); },
  async prodSave(){
    const p = S.m.id ? S.prod.find(x => x.id === S.m.id) : null;
    const g = (k, d) => S.f["pe_" + k] ?? d;
    const nombre = clean(g("nombre", p ? p.nombre : ""));
    const unidades = Math.max(1, Math.round(Number(g("unidades", p ? uni(p) : 1)) || 1));
    const precio = r2(g("precio", p ? p.precio : 0));
    if (!nombre) return toast("Escribe el nombre del producto.");
    if (!(precio > 0)) return toast("Escribe el precio.");
    const codigo = clean(g("codigo", p ? codDe(p) : sugerirCodigo(g("cat", "")))).toUpperCase();
    if (S.prod.some(x => x !== p && codDe(x) && codDe(x) === codigo)) return toast("Ese código ya existe.");
    const data = {codigo, nombre, categoria: clean(g("cat", p ? p.categoria : "")) || "Otros", unidad: clean(g("unidad", p ? unidadDe(p) : "unidad")) || "unidad",
      presentacion: clean(g("pres", p ? presDe(p) : "")), unidades, precio, activo: !!g("activo", p ? p.activo !== false : true),
      soloPresentacion: !!g("solo", p ? soloPres(p) : false)};
    const id = p ? p.id : "p-" + nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
    if (!p) { if (S.prod.some(x => x.id === id)) return toast("Ya existe un producto con ese nombre."); data.orden = 999; data.creadoPor = S.me.uid; if (!puede("admin")) { data.creadoPorNombre = S.me.nombre || S.me.email; data.activo = true; } }
    if (await upd(doc(db, "productos", id), data, p ? "Producto actualizado" : "Producto agregado", true)) { clearProd(); S.m = null; draw(); }
  }
};
function clearProd(){ Object.keys(S.f).filter(k => k.startsWith("pe_")).forEach(k => delete S.f[k]); }
async function marcarEnviada(){
  const c = S.m && S.cot.find(x => x.id === S.m.id);
  if (!c || c.estado !== "cotizada" || c.eliminada) return;
  if (!(puede("admin", "facturador") || c.vendedor === S.me.uid)) return;
  try { await updateDoc(doc(db, "cotizaciones", c.id), {enviada: Date.now()}); } catch (e) { console.warn(e); }
}
function clearForm(){ Object.keys(S.f).filter(k => /^(fac_|p_)/.test(k)).forEach(k => delete S.f[k]); }
function leerPago(x){
  const monto = r2(S.f.p_monto ?? saldo(x));
  if (!(monto > 0)) { toast("Escribe un monto mayor que cero."); return null; }
  if (monto > saldo(x) + 0.005) { toast("El pago es mayor que el saldo (" + L(saldo(x)) + ")."); return null; }
  return {monto, fecha: S.f.p_fecha || today(), metodo: S.f.p_met || x.formaPago || "Transferencia", ref: clean(S.f.p_ref), por: S.me.uid};
}
async function upd(ref, data, msg, merge){
  S.busy = true; draw();
  try {
    if (merge) await setDoc(ref, data, {merge: true}); else await updateDoc(ref, data);
    toast(msg); S.busy = false; draw(); return true;
  } catch (e) { fallo(e, "guardar"); S.busy = false; draw(); return false; }
}

function refrescarCarrito(){
  const cc = calc(S.cart);
  cc.lines.forEach((l, n) => {
    const a = document.getElementById("imp" + n); if (a) a.textContent = L(l.imp);
    const p = document.getElementById("pct" + n); if (p) p.textContent = l.desc ? pctTxt(l.pct) : "0%";
  });
  const t = document.getElementById("ctot"); if (t) t.innerHTML = totalsHtml(cc);
  const b = document.getElementById("ctabtn"); if (b && !S.busy) b.textContent = "Cotizar · " + L(cc.total);
}
function leerCarrito(t){
  const n = Number(t.dataset.cq ?? t.dataset.cd ?? t.dataset.cpr), i = S.cart[n]; if (!i) return null;
  const v = Number(t.value);
  if (t.dataset.cq != null) { if (v >= 1) i.cant = Math.round(v); }
  else if (t.dataset.cd != null) i.desc = Math.max(0, r2(t.value));
  else if (t.value !== "" && v >= 0) i.precio = v * 1.15;
  return i;
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const f = A[b.dataset.a]; if (f) { e.preventDefault(); f(b.dataset.v); }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") { S.m = null; draw(); } });
document.addEventListener("focusin", e => { const t = e.target; if (t.matches && t.matches('input[type="number"]')) setTimeout(() => { try { t.select(); } catch (_) {} }, 0); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.m) { S.m = null; draw(); }
  if (e.key === "Enter" && e.target.matches("tr.click")) e.target.click();
  if (e.key === "Enter" && S.screen === "auth" && e.target.matches("#view input")) A.authGo();
});
document.addEventListener("input", e => {
  const t = e.target, k = t.dataset.k;
  if (t.dataset.cq != null || t.dataset.cd != null || t.dataset.cpr != null) { if (leerCarrito(t)) refrescarCarrito(); return; }
  if (k) {
    S.f[k] = t.type === "checkbox" ? t.checked : t.value;
    if (k === "pe_cat" && S.m && !S.m.id && S.f.pe_codigo == null) { const o = $("#pe_codigo"); if (o) o.value = sugerirCodigo(t.value); }
    if (k === "cq" || k === "prq") draw();
    if (k === "pe_precio" || k === "pe_unit" || k === "pe_unidades") {
      const un = Math.max(1, Number(($("#pe_unidades") || {}).value) || 1);
      if (k === "pe_unit") { const v = r2(Number(t.value) * 1.15 * un); S.f.pe_precio = t.value === "" ? "" : v; const o = $("#pe_precio"); if (o) o.value = S.f.pe_precio; }
      else { const pr = Number(($("#pe_precio") || {}).value); const v = Math.round(pr / 1.15 / un * 10000) / 10000; S.f.pe_unit = isFinite(v) && pr ? v : ""; const o = $("#pe_unit"); if (o) o.value = S.f.pe_unit; }
    }
    if (k === "bq") draw();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.k) S.f[t.dataset.k] = t.type === "checkbox" ? t.checked : t.value;
  if (t.dataset.cq != null || t.dataset.cd != null || t.dataset.cpr != null) {
    const i = leerCarrito(t);
    if (i && t.dataset.cq != null) t.value = i.cant;
    if (i && t.dataset.cd != null) { const l = calc([i]).lines[0]; if (l.desc !== i.desc) i.desc = l.desc; t.value = i.desc || ""; }
    refrescarCarrito(); return;
  }
  if (t.dataset.k === "fac_fp") delete S.f.fac_pagado;
  if (t.dataset.redraw || t.dataset.k === "fac_fp") draw();
});
draw();

</script>
</body>
