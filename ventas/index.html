<style>
:root{
  --paper:#F5F6F3;--card:#FFFFFF;--ink:#172033;--muted:#5B6474;--line:#DCE0E6;--chip:#EEF1F5;
  --navy:#14264B;--gold:#E0A526;--accent:#14264B;--on-accent:#FFFFFF;
  --ok:#1E7A4B;--ok-bg:#E4F3EA;--warn:#8A5200;--warn-bg:#FCF1DC;--bad:#B42318;--bad-bg:#FBE7E5;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1420;--card:#161E2E;--ink:#E8ECF2;--muted:#9AA4B5;--line:#2A3447;--chip:#1F2A3F;
  --navy:#0B1630;--gold:#F0B93A;--accent:#F0B93A;--on-accent:#172033;
  --ok:#5CCB8F;--ok-bg:#15301F;--warn:#F0B93A;--warn-bg:#33270E;--bad:#FF8A7E;--bad-bg:#3A1714;}}
:root[data-theme="dark"]{
  --paper:#0E1420;--card:#161E2E;--ink:#E8ECF2;--muted:#9AA4B5;--line:#2A3447;--chip:#1F2A3F;
  --navy:#0B1630;--gold:#F0B93A;--accent:#F0B93A;--on-accent:#172033;
  --ok:#5CCB8F;--ok-bg:#15301F;--warn:#F0B93A;--warn-bg:#33270E;--bad:#FF8A7E;--bad-bg:#3A1714;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
.hwrap{max-width:none;margin:0 auto;padding:14px 12px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.01em;margin-right:auto}
.brand span{color:var(--gold);font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.92}
.who img{width:26px;height:26px;border-radius:50%}
nav{max-width:none;margin:0 auto;padding:10px 6px 0;display:flex;flex-wrap:wrap;gap:2px}
@media (max-width:760px){nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{scroll-snap-align:start}}
nav button{background:none;border:0;color:#C9D3E6;padding:10px 14px 12px;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
nav button[aria-current="page"]{background:var(--paper);color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
main{max-width:none;margin:0 auto;padding:22px 12px 80px}
h1{font-size:24px;line-height:1.2;margin:0 0 4px;font-weight:800;letter-spacing:-.015em}
h2{font-size:17px;margin:0 0 12px;font-weight:700}
.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px}
.field{margin-bottom:12px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:42px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 150px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 14px;min-height:40px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.scroll{overflow-x:auto;max-width:100%;min-width:0}.cot-doc-fila{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--chip)}
.stub{display:inline-block;font-weight:700;letter-spacing:.02em;padding:2px 8px 2px 7px;border-left:3px solid var(--gold);background:var(--chip);border-radius:0 6px 6px 0;white-space:nowrap}
.bigstub{font-size:26px;font-weight:800;letter-spacing:.01em;border-left:5px solid var(--gold);padding:2px 0 2px 12px;line-height:1.15}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.b-sf{background:#8dcaff;color:#123d68}.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--chip);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
@media (max-width:620px){.stats{grid-template-columns:1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert b{color:var(--bad)}
.plist{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.pitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.pitem .n{flex:1;min-width:0}
.pitem small{color:var(--muted)}
.qty{width:74px;min-height:36px;padding:6px 8px;text-align:right}
.pin{width:110px;min-height:36px;padding:6px 8px;text-align:right}
.totals{margin-left:auto;max-width:300px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .t{font-weight:800;font-size:18px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.note{font-size:13px;color:var(--muted)}
.msg{padding:40px 20px;text-align:center;max-width:520px;margin:40px auto}
#modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:none;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 12px 24px;overflow-y:auto;z-index:20}
#modal.open{display:flex}
.sheet{background:var(--card);border-radius:16px;width:100%;max-width:720px;padding:20px;position:relative}
.x{position:absolute;top:12px;right:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:12px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;display:none;z-index:30;max-width:90vw}
.muted{color:var(--muted)}
#asisBtn[hidden],#asisPanel[hidden]{display:none!important}
#asisBtn{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:25;width:52px;height:52px;display:grid;place-items:center;background:var(--gold);color:#172033;border:2px solid rgba(255,255,255,.65);border-radius:50%;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#asisBtn svg{width:24px;height:24px}
#asisBtn.arrastrando{cursor:grabbing;transform:scale(1.08)}
#asisBtn svg{flex:none}
#asisPanel{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:26;width:400px;max-width:calc(100vw - 32px);height:min(640px,calc(100vh - 32px));background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}
#asisPanel .as-head{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);cursor:move;touch-action:none}
@media (max-width:560px){#asisPanel .as-head{cursor:default}}
/* Pizarra */
.pz-add{display:grid;grid-template-columns:minmax(0,1fr) 170px 160px auto auto;gap:8px;align-items:end}
@media (max-width:860px){.pz-add{grid-template-columns:1fr 1fr}.pz-add .pz-txtf{grid-column:1/-1}}
.pz-mic{min-width:44px}
.pz-mic.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.pz-cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start;margin-top:14px}
@media (max-width:1100px){.pz-cols{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.pz-cols{grid-template-columns:1fr}}
.pz-col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.pz-col h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.pz-col h3 small{background:var(--chip);border-radius:99px;padding:1px 8px;color:var(--muted);font-size:12px}
.pz-dia{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 2px 4px}
.pz-card{display:flex;gap:8px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.pz-card.atr{border-color:var(--bad)}
.pz-chk{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);background:transparent;cursor:pointer;margin-top:1px;padding:0}
.pz-chk:hover{border-color:var(--ok);background:var(--ok-bg)}
.pz-body{flex:1;min-width:0;cursor:pointer}
.pz-t{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.pz-m{font-size:12px;color:var(--muted);margin-top:2px}
.pz-m .atr{color:var(--bad);font-weight:700}
.pz-refs{display:flex;flex-direction:column;gap:4px}
.pz-ref{border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:11px;font-weight:700;padding:2px 6px;cursor:pointer;color:var(--ink);white-space:nowrap}
.pz-vacio{font-size:13px;color:var(--muted);padding:6px 2px}
.pz-det{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:1100px){.pz-det{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.pz-det{grid-template-columns:1fr}}
.pz-it{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.pz-it:first-of-type{border-top:0}
.pz-it>div{flex:1;min-width:0;font-size:13px}
.pz-it small{color:var(--muted)}
.pz-hechas .pz-card{opacity:.6}
.pz-hechas .pz-t{text-decoration:line-through}
#asisPanel .as-head b{font-size:16px;margin-right:auto}
#asisPanel .as-head small{opacity:.8;font-size:12px}
#asisPanel .as-head button{background:transparent;border:0;color:#fff;font-size:18px;cursor:pointer;padding:4px 6px;line-height:1}
.as-box{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px;display:flex;flex-direction:column;gap:10px}
.as-box .bub{max-width:92%}
.as-box .bub.yo{background:var(--chip);color:var(--ink);align-self:flex-end;border:1px solid var(--line)}
.as-box .bub.in{background:var(--card);align-self:flex-start}
.as-box .bub ul{margin:4px 0;padding-left:18px}
.as-box .bub li{margin:2px 0}
.as-box .bub p{margin:4px 0}
.as-rap{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}
.as-rap button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.as-rap button:disabled{opacity:.5}
.as-form{display:flex;gap:8px;align-items:flex-end;padding:10px 12px 12px}
.as-form textarea{flex:1;min-height:44px;max-height:140px;resize:none}
.as-pie{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px 10px;font-size:12px;color:var(--muted)}
.as-pie button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
.as-pensando{color:var(--muted);font-style:italic}
.pr-resumen{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.pr-resumen>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:140px}
.pr-resumen small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.pr-resumen b{font-size:20px;font-variant-numeric:tabular-nums}
.pr-tabla td,.pr-tabla th{white-space:nowrap}
.pr-tabla td:nth-child(2){white-space:normal;min-width:180px}
.pc-in{width:110px;text-align:right;padding:6px 8px;min-height:34px}
.as-ok{margin-left:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.as-ok:hover{color:var(--ok);border-color:var(--ok)}
.as-ok.hecho,.as-ok.hecho:hover{background:var(--ok);border-color:var(--ok);color:var(--card);cursor:default}
.as-link{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer;text-align:left}
.as-link:hover{text-decoration-color:currentColor}
@media (max-width:560px){#asisPanel{inset:0;width:auto;max-width:none;height:auto;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}}

.authbox{max-width:440px;margin:30px auto}
.authbox a{color:var(--accent);font-weight:600}
.out{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:4px 10px;font-weight:600;cursor:pointer;margin-left:6px}

input,select,textarea{font-size:16px}
.narrow{max-width:680px;margin:0 auto}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--paper)}
.ihead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.irow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:10px;flex-wrap:wrap}
.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.step button{width:44px;min-height:44px;border:0;background:var(--chip);font-size:20px;font-weight:700;cursor:pointer}
.step input{width:96px;font-weight:700;border:0;border-radius:0;text-align:center;min-height:44px;padding:0 4px}
.addrow{display:flex;gap:10px;align-items:stretch}
.grow{flex:1}
.mini{display:block;font-size:11px;margin:0 0 2px;color:var(--muted);font-weight:600;text-align:left}
.dsc{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dsc .mini{width:100%}
.dsc .pin{width:110px;min-height:44px}
.pct{font-weight:700;color:var(--muted);min-width:44px}
.cta{position:sticky;bottom:0;margin-top:8px;z-index:5;background:var(--paper);padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--line)}
.cta.quieta{position:static;border-top:0}
.btn.big{width:100%;min-height:54px;font-size:17px;border-radius:12px;box-shadow:0 6px 18px rgba(10,20,40,.18)}
.ctarow{display:flex;gap:8px}.ctarow .sec{flex:0 0 34%;background:var(--card);box-shadow:0 6px 18px rgba(10,20,40,.12)}.ctarow .pri{flex:1}
.cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--line);color:var(--ink);font-size:11px;font-weight:800;text-align:center;line-height:18px;margin-left:2px}
.cnt.hot{background:#D92D20;color:#fff}
a.btn{color:inherit}
.chatbox{max-height:52vh;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.4}
.bub small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.bub.in{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.bub.out{align-self:flex-end;background:var(--ok-bg)}
.bub.eq{align-self:flex-end;background:var(--warn-bg)}
.tfoot td{border-top:2px solid var(--line);background:var(--chip);padding-top:12px;padding-bottom:12px}
.cli-lista{max-height:280px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.cli-op{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 12px;cursor:pointer;min-height:48px}
.cli-op:last-child{border-bottom:0}
.cli-op small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.cli-op.nuevo{color:var(--accent);font-weight:700}
.cli-op:active,.cli-op:hover{background:var(--chip)}
.cli-elegido{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;background:var(--chip)}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">MHAS <span>Ventas</span></div>
    <div class="who" id="who"></div>
  </div>
  <nav id="tabs" aria-label="Secciones"></nav>
</header>
<main id="view"><div class="msg">Cargando…</div></main>
<div id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="toast" role="status"></div>
<button id="asisBtn" type="button" data-a="asAbrir" hidden aria-label="Abrir asistente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg></button>
<aside id="asisPanel" hidden aria-label="Asistente"></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const REGLAS_DEF = "# Atención de WhatsApp · MHAS de Honduras\n\n\n\n## 1. Conversación y datos\n\n- Sea rápido, cordial y de usted. Hable como MHAS, sin atribuirse género ni suponer el del cliente. Un mensaje breve por turno, máximo una pregunta. Tono natural y profesional, sin emojis por defecto; solo uno si es necesario para aclarar información, nunca como adorno ni copiado del perfil. Negrita con *un asterisco*. Espere la respuesta antes de hacer otra pregunta. No agregue preguntas por cortesía ni repita saludos. El sistema gestiona saludos y recordatorios programados: no los duplique ni adelante.\n\n- La solicitud inicial pide juntos RTN, nombre o empresa, dirección de entrega y producto. Omita lo ya recibido y no repita el bloque si la bienvenida lo pidió. Con respuestas parciales, avance: no vuelva a pedir un dato mientras el cliente aclara productos o hace otra consulta. Retome solo el faltante indispensable al terminar esa aclaración; nunca repita lo ya respondido ni invente datos.\n\n- Responda primero todo lo que consulta, sin cerrar cada respuesta con una pregunta. Si compara opciones del producto solicitado, dé presentación, unidad y precio juntos en una lista breve, sin incluir otros colores o productos que no pidió. Con pedido definido, muestre cantidades y subtotal con ISV antes de pedir el dato indispensable que falte; no espere datos fiscales. Para un total con entrega necesita zona y flete suficientes; si falta algo, identifique el importe como subtotal, sin prometer total final.\n\n- Use solo el catálogo, las notas del producto y los datos vigentes del sistema; prevalecen sobre el historial. El anuncio no confirma qué desea comprar. No ofrezca listas ni precios de productos no solicitados.\n\n- Si agradece, cierre brevemente. Si quiere revisar, espere sin insistir. Si rechaza una opción, no la repita. Si pide no recibir mensajes, cierre y pase al equipo para registrar la baja, sin afirmar que ya se registró.\n\n- No afirme reservas, stock, pagos recibidos ni acciones sin confirmación. Consultar bodega registra una solicitud; no confirma disponibilidad ni respuesta.\n\n\n\n## 2. Producto y medida\n\n- Para empresas, presente el precio unitario como «L 126.09 + ISV», usando el importe sin ISV calculado por el sistema; no cambie el precio ni exima el impuesto. Para los demás clientes, precio con ISV. Al totalizar, separe subtotal sin ISV, ISV y total con ISV; conserve la unidad de cobro exacta. Rollos térmicos/químicos, formas y etiquetas: presentación completa y contenido, sin ofrecer piezas sueltas. En cinta, film, ribbon y clisés respete la unidad de la lista. Precio por libra no es precio por rollo: el equipo confirma peso y total.\n\n- Stretch film: si pregunta por cajas, explique que se maneja a granel y se entrega por unidades según la cantidad que necesite; no invente cantidades por caja ni exija comprar una caja. Respete la unidad de cobro de la lista; si es por libra, el equipo confirma peso y total.\n\n- Etiquetas: una medida puede venir en cualquier orden (4x1 = 1x4); «rollo de 2x1» se refiere a etiquetas. Térmicos sin medida: pregunte ancho del papel o modelo verificable; puede orientar con 80 mm x 60 m y 57 mm x 16 m si corresponde. Una foto o el tipo portátil/escritorio no prueban compatibilidad.\n\n- Distinga ancho, largo, diámetro, grosor y peso; no los use como equivalentes. En film, micras es grosor y pies es largo; no garantice igual resistencia solo por tener el mismo grosor. Un número aislado, como 48 mm, requiere aclarar ancho o diámetro; si dice negro, aclare papel o impresión. Una sola aclaración por turno, solo si hace falta; no sustituya lo pedido sin acuerdo.\n\n- Equivalencias conocidas: 58 mm, 2 1/4 pulgadas o 5.5–6 cm → 57 mm; 3 1/8 pulgadas o 7.5–8 cm → 80 mm; 4 1/4 pulgadas u 11 cm → 110 mm. En 57x40 u 80x70 el segundo número es diámetro: 57x40 → 57 mm x 16 m; 80x70 u 80x80 → 80 mm x 60 m. Use la medida del cliente sin explicar la equivalencia salvo que lo pida.\n\n- Si pide fotos, use enviar_fotos. Para producto o medida fuera de lista, use consultar_produccion. Alternativa solo si sirve al mismo uso y no fue rechazada; nunca afirme que una medida mayor cabe. Compatibilidad incierta: equipo.\n\n\n\n## 3. Entrega y pago\n\n- Dirección, cobertura, flete, envío gratis, pedido mínimo, horario y plazo: datos vigentes del sistema. Choloma, La Lima y Villanueva cuentan como fuera de SPS. No invente rutas ni prometa entrega/despacho más rápido que el plazo indicado; si no cubre el caso, confirme con el equipo.\n\n- En SPS sume el flete que corresponda. Fuera de SPS, separe productos del flete que la paquetería cobra al recibir (Forza o Cargo Expreso); no invente su costo ni lo presente incluido. C807 solo si el cliente lo solicita expresamente; no lo ofrezca como opción habitual ni lo sugiera por el historial. Si no alcanza el mínimo, diga cuánto falta y sugiera completar una vez.\n\n- Transferencia por defecto, sin preguntarla. En SPS puede pagar en efectivo si lo solicita. Si solicita contra entrega (también efectivo al recibir), registre la forma de pago «50/50»: 50% de anticipo aplicado al total y 50% al recibir; tener RTN no exime del anticipo. Solicítelo al confirmar el pedido, no al iniciar la cotización. En productos personalizados o condiciones especiales del proveedor, el equipo confirma las condiciones antes de comprometer el pedido. El equipo puede autorizar una excepción a clientes recurrentes con buen historial; nunca la suponga. Ante un incumplimiento previo, el equipo confirma pago anticipado. No ofrezca crédito, tarjeta ni link de pago.\n\n- Use únicamente el anticipo y saldo que devuelve el sistema. Si falta un importe o requiere confirmación, no calcule ni invente el monto: pase al equipo con transición breve y aviso interno. Al cliente diga «anticipo para confirmar el pedido», indicando «50% de anticipo y 50% al recibir», sin revelar costos de compra. No es un cargo adicional ni afirme que sea no reembolsable. Si cambia la forma de pago, actualice la cotización. El equipo verifica el ingreso antes de despachar; una captura no confirma el pago.\n\n\n\n## 4. Cotización y aceptación\n\n- Use el nombre o empresa ya recibido. Con producto, cantidad, nombre de referencia y entrega claros, use crear_cotizacion sin pedir permiso adicional ni esperar RTN, correo o dirección exacta que no afecte el envío. RTN y datos fiscales completos se requieren para la factura, que emite un facturador; no los invente.\n\n- Presente total con ISV, flete conocido o condición pendiente y transferencia por defecto. La herramienta confirma si se envió el PDF; si falló, pase al equipo para resolverlo, sin prometer plazo.\n\n- Pida aceptación una sola vez si aún falta. Si ya aceptó, pase al equipo/facturador sin reconfirmar. Si modifica el pedido, use crear_cotizacion con todo el pedido actualizado. Cotice pedidos grandes igual, salvo condiciones especiales. Si el pedido ya tiene abonos, pase al equipo para revisar los cambios conservando los pagos; no cree otra cotización ni vuelva a solicitar el anticipo.\n\n\n\n## 5. Atención humana\n\nUse pasar_a_persona para registrar la atención y activar el aviso interno al número configurado. Haga una transición breve como «Permítame un momento, se lo confirmo», sin anunciar que otro agente, asesor o ejecutivo responderá. No prometa tiempo ni afirme que el aviso fue recibido. No añada otra pregunta de venta al derivar. Casos:\n\n- Descuento, mayoreo, precio especial, solicitud de quitar el ISV o exoneración, zona libre, crédito, factura especial o fraccionar presentaciones completas. Mostrar la base «+ ISV» no requiere derivación.\n\n- Etiquetas personalizadas/impresas: explique que se fabrican a medida y el equipo confirma detalles. Dato técnico, compatibilidad, peso o entrega especial sin verificar.\n\n- Aceptación de cotización, pago/entrega, comprobante (agradezca sin confirmar ingreso), pedido en curso, reclamo o solicitud de persona.\n\n- Proveedor: agradezca, dé el co const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L = n => "L. " + (Number(n) || 0).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
function ymd(d){ const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 10); }
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + Number(n || 0)); return ymd(d); };
const diffDays = (a, b) => Math.round((new Date(a + "T12:00:00") - new Date(b + "T12:00:00")) / 864e5);
const fdate = s => { if (!s) return ""; const [y, m, d] = s.split("-"); return `${d}/${m}/${y}`; };
const clean = s => String(s || "").trim();

function iniciales(u){

function sugerirCodigo(cat){
  const p = PREF[cat] || (String(cat || "OTR").normalize("NFD").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase() || "OTR");
  const max = S.prod.map(codDe).filter(c => c.startsWith(p + "-")).map(c => Number(c.split("-")[1]) || 0).reduce((a, b) => Math.max(a, b), 0);

const presDe = p => p.presentacion || (SEEDMAP[p.id] || {}).presentacion || "";
const plural = (n, u) => n === 1 ? u : (u === "clisé" ? "clisés" : u + "s");
function calc(items, flete){
  const lines = (items || []).map(i => {
    const u = (Number(i.precio) || 0) / 1.15, bruto = r2(u * i.cant);
    const descX = Math.min(bruto, Math.max(0, Math.round((Number(i.desc) || 0) * 1e4) / 1e4)); // descuento sin ISV (4 decimales)
    const desc = r2(descX);
    const imp = r2(bruto - descX);
    return {u, bruto, desc, descX, descIsv: r2(descX * 1.15), pct: bruto ? Math.round(descX / bruto * 1000) / 10 : 0, imp, un: i.cant ? imp / i.cant : 0,
      conIsv: r2(i.cant * (Number(i.precio) || 0) - descX * 1.15)};
  });
  const sub = r2(lines.reduce((a, l) => a + l.bruto, 0));
  const desc = r2(lines.reduce((a, l) => a + l.desc, 0));
  const fleteIsv = Math.max(0, r2(Number(flete) || 0)), fleteB = r2(fleteIsv / 1.15); // flete con ISV, aparte de los productos
  const total = r2(lines.reduce((a, l) => a + l.conIsv, 0) + fleteIsv);
  const base = r2(sub - desc);
  const unidades = (items || []).reduce((a, i) => a + (Number(i.cant) || 0), 0);
  return {lines, sub, desc, base, isv: r2(total - base - fleteB), total, flete: fleteB, fleteIsv, unidades, n: lines.length};
}

const pagado = c => r2((c.pagos || []).reduce((a, p) => a + (Number(p.monto) || 0), 0));
const saldo = c => r2((Number(c.total ?? c.monto) || 0) - pagado(c));
function estadoPago(x, cobro){
  if (saldo(x) <= 0.005) return [cobro ? "Finalizada" : "Pagada", "b-ok"];
  if (cobro) { const d = x.vence ? diffDays(today(), x.vence) : 0; return d > 0 ? ["Espera de pago · " + d + (d === 1 ? " día" : " días"), d > 7 ? "b-bad" : "b-warn"] : ["Espera de pago", "b-warn"]; }
  if (x.vence && diffDays(today(), x.vence) > 0) return [diffDays(today(), x.vence) + " días vencida", "b-bad"];
  if (x.vence) { const d = diffDays(x.vence, today()); return [d === 0 ? "Vence hoy" : "Vence en " + d + " días", "b-warn"]; }
  return ["Pendiente", "b-warn"];
}

// Contactos de una empresa (varias personas con su cargo, WhatsApp y correo). Los clientes viejos tienen uno solo en contacto/tel/email
function contactosDe(c){
  if (!c) return [];
  if (Array.isArray(c.contactos) && c.contactos.length) return c.contactos;
  const p = {nombre: c.contacto || "", cargo: c.cargo || "", tel: c.tel || "", correo: c.email || ""};
  return p.nombre || p.tel || p.correo ? [p] : [];
}
function ctcTxt(p){ return [p.nombre || "Sin nombre", p.cargo, p.tel].filter(Boolean).join(" · "); }
function ctcBusca(c){ return contactosDe(c).map(p => [p.nombre, p.cargo, p.tel, p.correo].join(" ")).join(" "); }
function notasForm(){
  const sel = S.f.cli_sel || "", cl = S.cli.find(c => c.id === sel);
  return Object.assign(notasAuto(sel === "__nuevo" ? S.f.cli_dir : (cl || {}).direccion), S.f.nsel || {});
}
// Lo que se escribió en el buscador se aprovecha para el cliente nuevo: 8 dígitos = teléfono, 13-14 dígitos = RTN, lo demás = nombre
function pasarBusquedaANuevo(){
  const q = clean(S.f.cli_q); if (!q) return;
  const d = q.replace(/[\s-]/g, "");
  if (/^\d{8}$/.test(d)) { if (!S.f.cli_tel) S.f.cli_tel = d.slice(0, 4) + "-" + d.slice(4); }
  else if (/^\d{13,14}$/.test(d)) { if (!S.f.cli_rtn) S.f.cli_rtn = d; }
  else if (!S.f.cli_nombre) S.f.cli_nombre = q.toUpperCase() === q ? q : q.replace(/\S+/g, w => w.charAt(0).toUpperCase() + w.slice(1));
}
function cliFiltrados(){
  const q = clean(S.f.cli_q).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return S.cli.filter(c => !q || [c.nombre, c.contacto, c.tel, c.rtn, ctcBusca(c)].join(" ").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(q))
    .sort((a, b) => (a.nombre || "").localeCompare(b.nombre || ""));
}
// Al terminar de escribir en el buscador (Enter o salir del campo): si el nombre, teléfono o RTN coincide exacto con un cliente, se toma ese;
// si no coincide con ninguno, se abre el formulario de cliente nuevo con lo escrito. Si hay varios parecidos, se deja la lista para elegir.
function cliResolver(){
  const q = clean(S.f.cli_q); if (!q || S.f.cli_sel) return;
  const nz = x => String(x || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim(), d = q.replace(/\D/g, "");
  const exacto = S.cli.find(c => nz(c.nombre) === nz(q) || (c.contacto && nz(c.contacto) === nz(q)) || (d.length >= 8 && (String(c.tel || "").replace(/\D/g, "").slice(-8) === d.slice(-8) || String(c.rtn || "").replace(/\D/g, "") === d)));
  if (exacto) return A.cliPick(exacto.id);
  if (!cliFiltrados().length) return A.cliPick("__nuevo");
}
function cliListHtml(){
  const lista = cliFiltrados(), qv = clean(S.f.cli_q);
  return `<button class="cli-op nuevo" data-a="cliPick" data-v="__nuevo">+ Cliente nuevo${qv && !lista.length ? ": <b>" + esc(qv) + "</b>" : ""}</button>` +
    lista.map(c => `<button class="cli-op" data-a="cliPick" data-v="${esc(c.id)}"><b>${esc(c.nombre)}</b>${c.contacto || c.tel ? `<small>${esc([c.contacto, c.tel].filter(Boolean).join(" · "))}</small>` : ""}</button>`).join("") +
    (lista.length ? "" : `<p class="empty" style="padding:10px">Ningún cliente coincide${qv ? ": se tomará como cliente nuevo." : "."}</p>`);
}

    <div><span class="muted">Subtotal con descuento</span><span>${L(cc.base)}</span></div>` : ""}
    ${cc.flete ? `<div><span class="muted">Flete</span><span>${L(cc.flete)}</span></div>` : ""}
    <div><span class="muted">ISV 15%</span><span>${L(cc.isv)}</span></div>
    <div class="t"><span>Total</span><span>${L(cc.total)}</span></div>`;
}

/* ---------- vista: cotizaciones ---------- */
function vCotizaciones(){
  if(S.filtro==="sincomprobante")S.filtro="fin";
  const F = {cotizada: "Abiertas", aprobada: "Por facturar", debe: "Espera de pago", fin: "Finalizadas", perdida: "No concretadas", anulada: "Anuladas", todas: "Todas"};
  if (S.admin) F.eliminadas = "Eliminadas";
  if (!F[S.filtro]) S.filtro = puede("admin", "facturador") ? "aprobada" : "cotizada";
  const q = clean(S.f.bq).toLowerCase();
  const vivas = S.cot.filter(c => !c.eliminada);
  const cuenta = {cotizada: vivas.filter(c => c.estado === "cotizada").length, aprobada: vivas.filter(c => c.estado === "aprobada").length,
    debe: vivas.filter(c => c.estado === "facturada" && saldo(c) > 0.005).length, perdida: vivas.filter(c => c.estado === "perdida").length};
  let list = S.cot.filter(c => {
    if (S.filtro === "eliminadas") return !!c.eliminada;
    if (c.eliminada) return false;
    switch (S.filtro) {
      case "debe": return ["facturada","vendida"].includes(c.estado) && saldo(c) > 0.005;
      case "fin": return c.estado === "vendida" || c.estado === "facturada" && saldo(c) <= 0.005;
      case "todas": return true;
      default: return c.estado === S.filtro;
    }
  });
  S._listaCot = null;
  if (q) list = list.filter(c => [c.numero, c.cliente && c.cliente.nombre, c.cliente && c.cliente.contacto, c.cliente && c.cliente.tel, c.factura && c.factura.numero].join(" ").toLowerCase().includes(q));
  const desde = S.f.fl_desde || "", hasta = S.f.fl_hasta || "", vend = S.f.fl_vend || "";
  if (desde) list = list.filter(c => (c.fecha || "") >= desde);
  if (hasta) list = list.filter(c => (c.fecha || "") <= hasta);
  if (vend) list = list.filter(c => unif(c.vendedor) === vend);
  S._listaCot = list;
  const esVend = rol() === "vendedor";
  const vendedores = [...new Map(S.cot.filter(c => c.vendedor).map(c => { const k = unif(c.vendedor), u = (S.usuarios || []).find(x => x.id === k); return [k, (k !== c.vendedor && u && (u.nombre || u.email)) || c.vendedorNombre || "Sin nombre"]; })).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  const tot = list.filter(c=>!c.sinComprobante).reduce((a, c) => { const cc = calcCot(c); a.total += Number(c.total) || 0; a.sub += cc.base; a.isv += cc.isv; a.desc += cc.desc; if (c.estado === "facturada") { a.pag += pagado(c); a.sal += Math.max(0, saldo(c)); } return a; }, {total: 0, sub: 0, isv: 0, desc: 0, pag: 0, sal: 0});
  const totalSF=list.filter(c=>c.sinComprobante).reduce((n,c)=>n+(Number(c.total)||0),0);
  const hoyS = today(), mes = hoyS.slice(0, 7);
  const mesAnt = (() => { const d = new Date(hoyS + "T12:00:00"); d.setDate(1); d.setMonth(d.getMonth() - 1); return ymd(d).slice(0, 7); })();
  const finMes = m => { const d = new Date(m + "-01T12:00:00"); d.setMonth(d.getMonth() + 1); d.setDate(0); return ymd(d); };
  const presets = [["hoy", "Hoy", hoyS, hoyS], ["mes", "Este mes", mes + "-01", finMes(mes)], ["mesant", "Mes pasado", mesAnt + "-01", finMes(mesAnt)], ["todo", "Todo", "", ""]];
  return `
  <h1>Cotizaciones</h1>
  <div class="actions" style="margin:0 0 10px"><button class="btn" data-a="cotCsv">Descargar (Excel)</button></div>
  <p class="sub">${esVend ? "Tus cotizaciones y en qué quedó cada una." : "Aprueba, factura y registra pagos desde aquí."}</p>
  <div class="chips" role="group" aria-label="Filtrar">${Object.entries(F).map(([k, t]) => `<button data-a="filtro" data-v="${k}" aria-pressed="${S.filtro === k}">${t}${cuenta[k] ? ` <span class="cnt${k === "aprobada" && puede("admin", "facturador") ? " hot" : ""}">${cuenta[k]}</span>` : ""}</button>`).join("")}</div>
  <div class="panel" style="padding:12px 14px">
    <div class="row">
      <div class="field" style="flex:2 1 220px"><label for="bq">Buscar por número, cliente, teléfono o factura</label><input id="bq" data-k="bq" value="${fv("bq")}" autocomplete="off"></div>
      <div class="field"><label for="fl_desde">Desde</label><input id="fl_desde" type="date" data-k="fl_desde" data-redraw="1" value="${esc(desde)}"></div>
      <div class="field"><label for="fl_hasta">Hasta</label><input id="fl_hasta" type="date" data-k="fl_hasta" data-redraw="1" value="${esc(hasta)}"></div>
      ${esVend ? "" : `<div class="field"><label for="fl_vend">Vendedor</label><select id="fl_vend" data-k="fl_vend" data-redraw="1"><option value="">Todos</option>${vendedores.map(([id, n]) => `<option value="${esc(id)}" ${vend === id ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>`}
    </div>
    <div class="chips" style="margin:0">${presets.map(([k, t, d, h]) => `<button data-a="flPreset" data-v="${k}" aria-pressed="${desde === d && hasta === h}">${t}</button>`).join("")}</div>
  </div>
  <div class="panel" style="padding:6px 10px"><div class="scroll">
  ${list.length ? `<table><thead><tr><th>Número</th><th>Cliente</th><th>Fecha</th>${esVend ? "" : "<th>Vendedor</th>"}<th class="num">Total</th><th>Estado</th></tr></thead><tbody>
  ${list.map(c => { const [et, ec] = ESTADO[c.estado] || [c.estado, ""]; const ep = ["facturada","vendida"].includes(c.estado) ? estadoPago(c, true) : null;
    return `<tr class="click" data-a="open" data-v="${esc(c.id)}" tabindex="0">
      <td><span class="stub">${esc(c.numero)}</span></td><td>${esc(c.cliente && c.cliente.nombre)}${c.cliente && c.cliente.tel ? `<br><small class="muted">${esc(c.cliente.tel)}</small>` : ""}${c.estado === "perdida" && c.motivoPerdida ? `<br><small class="muted">Motivo: ${esc(c.motivoPerdida)}</small>` : ""}</td><td>${fdate(c.fecha)}</td>
      ${esVend ? "" : `<td>${esc(c.vendedorNombre || "")}</td>`}<td class="num">${L(c.total)}</td>
      <td><span class="badge ${ec}">${et}</span>${c.estado==="vendida" ? ` <span class="badge b-sf">Finalizada</span>` : ep ? ` <span class="badge ${ep[1]}">${ep[0]}</span>` : ""}${c.estado!=="vendida" && !esVend && descTxt(c) ? ` <span class="badge b-warn">${descTxt(c)}</span>` : ""}${c.estado === "cotizada" && c.enviada ? ' <span class="badge">Enviada</span>' : ""}</td></tr>`; }).join("")}
  </tbody>
  <tfoot><tr class="tfoot"><td colspan="${esVend ? 3 : 4}"><b>${list.length} ${list.length === 1 ? "cotización" : "cotizaciones"}</b><br><small class="muted">${totalSF ? `Con factura ${L(tot.total)} · SF ${L(totalSF)}` : "Totales del grupo con ISV"}</small>${list.some(c=>!c.sinComprobante)?`<br><small class="muted">Subtotal ${L(tot.sub)} · ISV ${L(tot.isv)}${!esVend && tot.desc > 0 ? " · descuentos " + L(tot.desc) : ""}${tot.pag > 0 || tot.sal > 0 ? " · cobrado " + L(tot.pag) + " · por cobrar " + L(tot.sal) : ""}</small>`:""}</td><td class="num"><b>${L(tot.total+totalSF)}</b></td><td></td></tr></tfoot>
  </table>` : `<p class="empty">No hay cotizaciones con estos filtros.</p>`}
  </div></div>`;
}

function descTxt(c){ const cc = calc(c.items); return cc.desc > 0 ? "Con descuento · " + L(cc.desc) + " (" + pctTxt(cc.sub ? Math.round(cc.desc / cc.sub * 1000) / 10 : 0) + ")" : ""; }

/* ---------- vista: por cobrar ---------- */
function vCobros(){
  const fac = S.cot.filter(c => ["facturada","vendida"].includes(c.estado) && !c.eliminada);
  const pend = fac.filter(c => saldo(c) > 0.005).sort((a, b) => (a.vence || "").localeCompare(b.vence || ""));
  const porCobrar = r2(pend.reduce((a, c) => a + saldo(c), 0));
  const vencido = r2(pend.filter(c => c.vence && diffDays(today(), c.vence) > 0).reduce((a, c) => a + saldo(c), 0)); // vence = fecha máx. de crédito, o 3 días después de la factura
  const mes = today().slice(0, 7);

function mdAs(t){
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\s)\*([^*\n]+)\*(?=\s|$|[.,:;])/g, "$1<b>$2</b>").split("\n");
  let h = "", ul = false;
  for (const l of lines) {
    const m = l.match(/^\s*[-•*]\s+(.*)/);
    if (m) { if (!ul) { h += "<ul>"; ul = true; } h += "<li>" + m[1] + "</li>"; continue; }
    if (ul) { h += "</ul>"; ul = false; }
    if (/^#{1,4}\s/.test(l)) h += "<p><b>" + l.replace(/^#+\s*/, "") + "</b></p>";
    else if (l.trim()) h += "<p>" + l + "</p>";
  }

function abPosicionar(){
  const b = $("#asisBtn"); if (!b || b.classList.contains("arrastrando")) return;
  const cta = document.querySelector(".cta:not(.quieta)"), extra = cta && AB.abajo < 90 ? 78 : 0;

(function(){
  const b = document.getElementById("asisBtn"); if (!b) return;
  let ini = null, mov = false, largo = null;
  b.addEventListener("pointerdown", e => {
    ini = {x: e.clientX, y: e.clientY}; mov = false;
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
    clearTimeout(largo);
    largo = setTimeout(() => { if (!mov && ini) { ini = null; AB.noClick = true; AB.oculto = true; try { localStorage.setItem("mhas_ab_oculto", "1"); } catch (_) {} b.hidden = true; toast("Ocultaste el botón del asistente. Lo vuelves a mostrar en Mi perfil o en la Pizarra."); } }, 900);
  });
  b.addEventListener("pointermove", e => {
    if (!ini) return;
    if (!mov && Math.hypot(e.clientX - ini.x, e.clientY - ini.y) < 8) return;
    mov = true; clearTimeout(largo); b.classList.add("arrastrando");
    b.style.right = ""; b.style.bottom = ""; b.style.left = Math.max(4, Math.min(window.innerWidth - 56, e.clientX - 26)) + "px"; b.style.top = Math.max(4, Math.min(window.innerHeight - 56, e.clientY - 26)) + "px";
  });
  const fin = e => {
    clearTimeout(largo);
    if (mov) {
      AB.lado = e.clientX < window.innerWidth / 2 ? "izq" : "der";
      AB.abajo = Math.max(10, Math.min(window.innerHeight - 80, Math.round(window.innerHeight - e.clientY - 26)));
      try { localStorage.setItem("mhas_ab_pos", JSON.stringify({lado: AB.lado, abajo: AB.abajo})); } catch (_) {}
      AB.noClick = true; setTimeout(() => { AB.noClick = false; }, 300);
      b.classList.remove("arrastrando"); abPosicionar();
    }
    ini = null; mov = false;
  };
  b.addEventListener("pointerup", fin); b.addEventListener("pointercancel", fin);
  window.addEventListener("resize", abPosicionar);
  document.addEventListener("scroll", () => abPosicionar(), {passive: true});
  // La ventana del chat se puede mover arrastrando la barra de arriba (solo en computadora)
  const p = document.getElementById("asisPanel"); let pi = null;
  p.addEventListener("pointerdown", e => {
    if (window.innerWidth <= 560 || !e.target.closest(".as-head") || e.target.closest("button")) return;
    const r = p.getBoundingClientRect(); pi = {dx: e.clientX - r.left, dy: e.clientY - r.top}; try { p.setPointerCapture(e.pointerId); } catch (_) {}
  });
  p.addEventListener("pointermove", e => {
    if (!pi) return;
    p.style.right = "auto"; p.style.bottom = "auto";
    p.style.left = Math.max(0, Math.min(window.innerWidth - 120, e.clientX - pi.dx)) + "px"; p.style.top = Math.max(0, Math.min(window.innerHeight - 60, e.clientY - pi.dy)) + "px";
  });
  const pfin = () => { pi = null; };
  p.addEventListener("pointerup", pfin); p.addEventListener("pointercancel", pfin);
})();

const ymdLocal = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

function tipoAuto(t){

}

function periodoMensajes(dias, ahora = Date.now()){
  const n = Number(dias);
  if (!Number.isInteger(n) || n < 1 || n > 365) throw new Error("Indique un número de días entre 1 y 365.");
  const hastaFecha = new Date(ahora - 6 * 3600e3).toISOString().slice(0, 10);
  const desde = Date.parse(hastaFecha + "T00:00:00-06:00") - (n - 1) * 864e5;
  return {dias: n, desde, hasta: ahora, desdeFecha: new Date(desde - 6 * 3600e3).toISOString().slice(0, 10), hastaFecha};
}

function statsCliente(c){
  const cs = S.cot.filter(x => !x.eliminada && x.cliente && (x.cliente.id === c.id));
  const fac = cs.filter(x => x.estado === "facturada");
  const pedidos = cs.filter(x => x.estado === "aprobada" || x.estado === "facturada")
    .map(x => ({f: (x.factura && x.factura.fecha) || x.fecha, x})).sort((a, b) => a.f.localeCompare(b.f));

function cantTxt(p, n){
  if (n == null) return "—";
  const u = uni(p), un = Number(n) || 0, base = un.toLocaleString("en-US") + " " + plu(Math.abs(un), unidadDe(p));
  if (u <= 1) return base;
  const pr = Math.round(un / u * 10) / 10;
  return `${pr.toLocaleString("en-US")} ${plu(pr, presPal(p))} <small class="muted">(${base})</small>`;
}
function porRecibir(id){ return (S.compras || []).filter(c => c.estado !== "anulada").reduce((n,c) => n + (c.items || []).filter(i => i.prod === id).reduce((a,i) => a + Math.max(0, (Number(i.cantidad) || 0) - (Number(i.recibida) || 0)) * (Number(i.unidades) || 1), 0), 0); }
function invDatos(){
  const ahora = Date.now(), X = {};

  (S.invMov || []).slice().sort((a, b) => (a.ts || 0) - (b.ts || 0)).forEach(m => {
    const x = X[m.prod]; if (!x) return;
    if (m.tipo === "conteo") { x.base = Number(m.cant) || 0; x.t0 = m.ts || 0; x.mov = 0; }
    else { if (x.t0 == null) { x.t0 = m.ts || 0; x.base = 0; } x.mov += Number(m.cant) || 0; }
  });
  S.cot.forEach(c => {
    if (c.eliminada) return;
    if (["cotizada","aprobada"].includes(c.estado)) (c.items || []).forEach(i => { const x = X[i.id]; if (x) x.comp += Number(i.cant) || 0; });
    if (!["facturada","vendida"].includes(c.estado)) return;
    const ts = invTs(c);
    (c.items || []).forEach(i => {
      const x = X[i.id]; if (!x) return; const n = Number(i.cant) || 0;
      if (x.t0 != null && ts >= x.t0 && !(Number(c.ventaSinComprobante?.inventarioIncluidoEnConteo?.[i.id]) >= x.t0)) x.sal += n;
      if (ahora - ts <= 30 * 864e5) x.v30 += n;
      if (ahora - ts <= 90 * 864e5) x.v90 += n;
    });
  });
  return Object.values(X).map(x => {
    const p = x.p, u = uni(p), exist = x.t0 == null ? null : x.base + x.mov - x.sal;
    const diaria = x.v90 / 90, sug = diaria > 0 ? Math.ceil(diaria * 10 / u) * u : 0; // 7 días de venta + 3 de margen, en presentaciones completas
    const guardado = (S.inv || {})[p.id], reorden = guardado && guardado.reorden != null ? Number(guardado.reorden) : sug;

    return {p, exist, comp: x.comp, disp, reorden, sug, manual: !!(guardado && guardado.reorden != null), estado, v30: x.v30, v90: x.v90, dias: exist != null && diaria > 0 ? Math.max(0, Math.floor(exist / diaria)) : null};
  });
}

  const nuevo = Object.assign({}, prev, cambios);
  if (nuevo.pagado && !liquidacion) { try { const res = await gastosUI.actualizar(); liquidacion = res.porFactura[c.id]; } catch (e) { fallo(e, "calcular gastos antes de cerrar"); return false; } }
  if (nuevo.pagado && !liquidacion?.cerrada) { toast("Primero cierre la quincena para fijar la utilidad."); return false; }
  if (nuevo.pagado && (!liquidacion || liquidacion.neta < 0)) { toast("Revise el cálculo y cualquier saldo negativo antes de marcar pagado."); return false; }
  const d = utilDe(c, nuevo.gastos);
  const b = writeBatch(db), ahora = Date.now();
  const fila = {numero: c.numero, factura: (c.factura && c.factura.numero) || "", reparto: nuevo.reparto || [], pagado: !!nuevo.pagado, actualizado: ahora, por: S.me.uid,

  if (nuevo.pagado) Object.assign(fila, {pagadoEn: ahora, pagadoPor: S.me.uid, gastosGeneralesAlPagar: liquidacion.generales / 100, netoPagado: liquidacion.neta / 100, pagadoPartes: liquidacion.partes.map(p => ({uid: p.uid, monto: p.neta / 100})), gastos: liquidacion.directos / 100, ...(Number(prev.gastos) > 0 ? {gastosManualesAnteriores: prev.gastos} : {}), snap: {venta: liquidacion.venta / 100, costo: liquidacion.costo / 100}});
  b.set(doc(db, "utilidad", c.id), fila, {merge: true});
  const quedan = new Set(fila.participantes);
  (fila.reparto).forEach(r => b.set(doc(db, "utilidad_partes", c.id + "__" + r.uid), {cot: c.id, numero: c.numero, factura: fila.factura, cliente: (c.cliente && c.cliente.nombre) || "",
    fecha: (c.factura && c.factura.fecha) || c.fecha || "", gastos: d.gastos, pct: Number(r.pct) || 0, monto: r2(d.neta * (Number(r.pct) || 0) / 100), pagado: !!nuevo.pagado, ...(nuevo.pagado ? {montoPagado: ((liquidacion.partes.find(p => p.uid === unif(r.uid)) || {}).neta || 0) / 100} : {}), uid: r.uid, actualizado: ahora}));
  (prev.participantes || []).filter(u => !quedan.has(u)).forEach(u => b.delete(doc(db, "utilidad_partes", c.id + "__" + u)));
  S.busy = true;
  try { await b.commit(); gastosUI.invalidar(); S.busy = false; return true; } catch (e) { S.busy = false; fallo(e, "guardar la utilidad (revisa las reglas de Firebase)"); return false; }
}

function numLetras(n){
  const U = ["", "UNO", "DOS", "TRES", "CUATRO", "CINCO", "SEIS", "SIETE", "OCHO", "NUEVE", "DIEZ", "ONCE", "DOCE", "TRECE", "CATORCE", "QUINCE", "DIECISÉIS", "DIECISIETE", "DIECIOCHO", "DIECINUEVE",
    "VEINTE", "VEINTIUNO", "VEINTIDÓS", "VEINTITRÉS", "VEINTICUATRO", "VEINTICINCO", "VEINTISÉIS", "VEINTISIETE", "VEINTIOCHO", "VEINTINUEVE"];
  const D = ["", "", "", "TREINTA", "CUARENTA", "CINCUENTA", "SESENTA", "SETENTA", "OCHENTA", "NOVENTA"];
  const C = ["", "CIENTO", "DOSCIENTOS", "TRESCIENTOS", "CUATROCIENTOS", "QUINIENTOS", "SEISCIENTOS", "SETECIENTOS", "OCHOCIENTOS", "NOVECIENTOS"];
  const m100 = x => x < 30 ? U[x] : D[Math.floor(x / 10)] + (x % 10 ? " Y " + U[x % 10] : "");
  const m1000 = x => x === 100 ? "CIEN" : ((x >= 100 ? C[Math.floor(x / 100)] + (x % 100 ? " " : "") : "") + (x % 100 ? m100(x % 100) : ""));
  if (n === 0) return "CERO";
  const mill = Math.floor(n / 1e6), mil = Math.floor(n % 1e6 / 1000), r = n % 1000, p = [];
  if (mill) p.push(mill === 1 ? "UN MILLÓN" : m1000(mill).replace(/UNO$/, "UN") + " MILLONES");
  if (mil) p.push(mil === 1 ? "MIL" : m1000(mil).replace(/UNO$/, "UN") + " MIL");
  if (r) p.push(m1000(r));
  return p.join(" ");
}
function totalLetras(t){
  const c = Math.round((Number(t) || 0) * 100), ent = Math.floor(c / 100), cen = c % 100;
  const s = numLetras(ent).replace(/UNO$/, "UN");
  return s + (ent === 1 ? " LEMPIRA" : " LEMPIRAS") + (cen ? " CON " + String(cen).padStart(2, "0") + "/100" : (ent === 1 ? " EXACTO" : " EXACTOS"));
}

const facSiguiente = () => facBlancos()[0] || null;

const facDeCot = c => { const numero=c?.factura?.numero, n=c?.factura?.n??Number(String(numero||" ").split("-").at(-1)); return c?.factura?(S.facturas||[]).find(f=>f.cotId===c.id&&f.n===n)||null:null; };
function datosFactura(c, cli, fecha, fp){

  const lineas = (c.items || []).map((i, k) => ({cant: qV(i), unidad: vuDe(i).n.toUpperCase(), desc: String(i.nombre || "").toUpperCase(), pu: Math.round(cc.lines[k].un * vuDe(i).f * 1e4) / 1e4, imp: cc.lines[k].imp}));
  if (cc.flete) lineas.push({cant: 1, unidad: "SERVICIO", desc: "FLETE DE ENTREGA", pu: cc.flete, imp: cc.flete});

}

  y += 6.6 + 7;
  const ns = notasDe(c), items = [];

  if (clean(c.notas)) items.push(["Nota:", clean(c.notas)]);
  if (items.length) {
  d.setFontSize(8.5);

    d.setFont("helvetica", "bold"); d.text(k, M + 1.5, ny);
    d.setFont("helvetica", "normal"); d.text(ls, M + 1.5 + lab, ny);

onAuthStateChanged(auth, u => entrar(u));
async function entrar(u){
  if (meSub) { meSub(); meSub = null; }
  stopData(); S.m = null; S.filtro = null; S.tab = null;
  S.u = u || null;
  if (!u) { S.admin = false; S.me = {uid: null, email: "", nombre: "", rol: "", ini: ""}; S.screen = "auth"; draw(); return; }
  if (u.email === ADMIN && !u.emailVerified) { S.screen = "verificar"; draw(); return; }
  S.admin = u.email === ADMIN && u.emailVerified;
  S.screen = "cargando"; draw();
  const ref = doc(db, "usuarios", u.uid);
  try {
    const s = await getDoc(ref);
    if (!s.exists()) await setDoc(ref, {nombre: u.displayName || clean(S.f.a_nombre), email: u.email, rol: "", ini: "", creado: Date.now()});
  } catch (e) { console.error(e); }
  meSub = onSnapshot(ref, s => {
    const d = s.exists() ? s.data() : {};
    S.me = {uid: u.uid, email: u.email, nombre: d.nombre || u.displayName || "", rol: d.rol || "", ini: d.ini || "", cargo: d.cargo || "", tel: d.tel || "", correo: d.correo || ""};
    S.screen = "app"; startData(); render();
  }, e => { console.error(e); S.me = {uid: u.uid, email: u.email, nombre: u.displayName || "", rol: "", ini: ""}; S.screen = "app"; startData(); draw(); });
}

/* ---------- correlativo ---------- */
async function siguienteNumero(ini){
  const ref = doc(db, "contadores", ini);
  const n = await runTransaction(db, async tx => {
    const s = await tx.get(ref);
    const n = (s.exists() ? Number(s.data().ultimo) || 0 : 0) + 1;
    tx.set(ref, {ultimo: n});
    return n;
  });
  return "COT-" + ini + "-" + String(n).padStart(4, "0");
}

  async talCargar(){
    if (!S.admin) return;
    const file = S.talFile; if (!file) return toast("Elige el PDF del talonario.");
    const ini = parseInt(S.f.tal_ini, 10);
    if (!(ini > 0)) return toast("Escribe el número de factura de la primera página del PDF.");
    const ref = (S.facturas || []).slice().sort((a, b) => b.n - a.n)[0] || CAI_DEF;
    const desde = parseInt(S.f.tal_desde ?? (ref.n ? ref.n + 1 : NaN), 10);
    if (!(desde > 0)) return toast("Escribe desde qué número cargar.");
    const cai = clean(S.f.tal_cai ?? ref.cai), ri = clean(S.f.tal_ri ?? ref.rangoIni), rf = clean(S.f.tal_rf ?? ref.rangoFin), lim = S.f.tal_lim ?? ref.fechaLimite;
    if (!cai || !ri || !rf || !lim) return toast("Completa CAI, rango y fecha límite.");
    const nIni = parseInt(ri.slice(-8), 10), nFin = parseInt(rf.slice(-8), 10);
    S.busy = true; S.talProg = "Leyendo PDF…"; draw();
    try {
      const PDFLib = await cargarPdfLib();
      const src = await PDFLib.PDFDocument.load(await file.arrayBuffer(), {updateMetadata: false});
      const ultimo = ini + src.getPageCount() - 1;
      const hasta = Math.min(parseInt(S.f.tal_hasta, 10) || ultimo, ultimo, nFin || ultimo);
      if (desde < ini || desde > hasta) throw new Error("El PDF tiene de la " + ini + " a la " + ultimo + "; revisa \"Cargar desde\".");
      if (nIni && desde < nIni) throw new Error("La " + desde + " está fuera del rango autorizado.");
      const ya = new Set((S.facturas || []).map(f => f.n));
      const nums = []; for (let n = desde; n <= hasta; n++) if (!ya.has(n)) nums.push(n);
      if (!nums.length) throw new Error("Esas facturas ya están cargadas.");
      S.busy = false; S.talProg = ""; draw();
      if (!confirm(`Se cargarán ${nums.length} facturas en blanco: de la ${nums[0]} a la ${nums[nums.length - 1]}.\n\nRevisa que la página 1 del PDF sea la factura ${ini}. Después puedes abrir cualquiera con el botón PDF para comprobar.`)) return;
      S.busy = true; draw();
      const {PDFDocument, PDFName} = PDFLib;
      let k = 0;
      for (const n of nums) {
        S.talProg = "Cargando " + (++k) + " de " + nums.length + "…"; draw();
        const page = src.getPage(n - ini);
        ["PieceInfo", "Thumb", "LastModified", "Metadata"].forEach(x => page.node.delete(PDFName.of(x)));
        const out = await PDFDocument.create();
        const [cp] = await out.copyPages(src, [n - ini]); out.addPage(cp);
        const b64 = b64de(await out.save({useObjectStreams: true}));
        const T = 700000, partes = Math.ceil(b64.length / T);
        if (partes > 4) throw new Error("La página " + n + " pesa demasiado (" + Math.round(b64.length / 1024) + " KB).");
        for (let p = 0; p < partes; p++) await setDoc(doc(db, "talonario_pdf", n + "_" + p), {pdf: b64.slice(p * T, (p + 1) * T)});
        await setDoc(doc(db, "facturas", String(n)), {n, numero: facNum(ri, n), estado: "blanco", cai, rangoIni: ri, rangoFin: rf, fechaLimite: lim, partes, cargado: Date.now(), cargadoPor: S.me.uid});
      }
      toast(nums.length + " facturas en blanco cargadas");
      S.talForm = false; S.talFile = null; Object.keys(S.f).filter(x => x.startsWith("tal_")).forEach(x => delete S.f[x]);
    } catch (e) { console.error(e); toast(e && e.code ? "No se pudo guardar (revisa las reglas de Firebase)." : (e && e.message) || "No se pudo leer el PDF."); }
    S.busy = false; S.talProg = ""; draw();
  },

  async chatsDescargar(){
    let periodo;
    try { periodo = periodoMensajes(S.f.chat_dias ?? 1); }
    catch (e) { return toast(e.message); }
    S.f.chat_dias = periodo.dias;
    S.busy = true; draw();
    try {
      const quien = {cliente: "Cliente", agente: "Agente", equipo: "Equipo"};
      const hora = ms => { const d = new Date(ms || 0); return fdate(new Date(d.getTime() - 6 * 3600e3).toISOString().slice(0, 10)) + " " + d.toLocaleTimeString("es-HN", {timeZone: "America/Tegucigalpa", hour: "2-digit", minute: "2-digit"}); };
      const cotizaciones = S.cot.filter(c => !c.eliminada && (c.fecha || "") >= periodo.desdeFecha && (c.fecha || "") <= periodo.hastaFecha);
      const conversaciones = [];
      let cursor = null;
      do {
        const filtros = [where("actualizado", ">=", periodo.desde), orderBy("actualizado", "desc"), limit(200)];
        if (cursor) filtros.push(startAfter(cursor));
        const pagina = await getDocs(query(collection(db, "conversaciones"), ...filtros));
        conversaciones.push(...pagina.docs.map(d => ({...d.data(), id: d.id})));
        cursor = pagina.docs.length === 200 ? pagina.docs[pagina.docs.length - 1] : null;
      } while (cursor);
      let cuerpo = "", cantidad = 0, mensajes = 0;
      for (const c of conversaciones) {
        const registros = [];
        cursor = null;
        do {
          const filtros = [where("ts", ">=", periodo.desde), where("ts", "<=", periodo.hasta), orderBy("ts", "asc"), limit(500)];
          if (cursor) filtros.push(startAfter(cursor));
          const pagina = await getDocs(query(collection(db, "conversaciones", c.id, "mensajes"), ...filtros));
          registros.push(...pagina.docs.map(d => d.data()));
          cursor = pagina.docs.length === 500 ? pagina.docs[pagina.docs.length - 1] : null;
        } while (cursor);
        if (!registros.length) continue;
        cantidad++; mensajes += registros.length;
        cuerpo += "\n==================================================\n" + nombreChat(c) + " · " + (c.tel || c.id) +
          (c.ultimaCotizacion ? " · última cotización " + c.ultimaCotizacion : "") + (c.consultaProduccion ? " · consulta producción: " + c.consultaProduccion : "") +
          "\n==================================================\n";
        registros.forEach(m => { cuerpo += "[" + hora(m.ts) + "] " + (quien[m.de] || m.de) + ": " + String(m.texto || "").replace(/\n/g, "\n    ") + "\n"; });
      }
      let out = "CHATS DE WHATSAPP · MHAS DE HONDURAS\nPeríodo: " + fdate(periodo.desdeFecha) + " a " + fdate(periodo.hastaFecha) + " · " + periodo.dias + (periodo.dias === 1 ? " día (hoy)" : " días, incluyendo hoy") + "\nDescargado: " + hora(periodo.hasta) + " · " + cantidad + " conversaciones · " + mensajes + " mensajes\n" + cuerpo;
      out += "\n\n==================================================\nCOTIZACIONES DEL MISMO PERÍODO (precio unitario con ISV y descuento con ISV)\n==================================================\n";
      cotizaciones.forEach(c => { const cc = calc(c.items);
        out += [c.numero, fdate(c.fecha), (ESTADO[c.estado] || [c.estado])[0], (c.cliente && c.cliente.nombre) || "", c.vendedorNombre || "", "total " + L(c.total)].join(" | ") + "\n";
        (c.items || []).forEach((i, n) => { const l = cc.lines[n]; out += "    " + i.cant + " × " + i.nombre + " @ " + L(i.precio) + (l.descX ? " · desc. " + L(l.descIsv) + " (" + pctTxt(l.pct) + ")" : "") + " = " + L(l.conIsv) + "\n"; }); });
      out += "\n\n==================================================\nLISTA DE PRECIOS VIGENTE (" + fdate(today()) + ")\n==================================================\nCódigo | Producto | Presentación | Con ISV | Unitario con ISV | Activo | Nota para el agente\n";
      S.prod.slice().sort((x, y) => (x.orden ?? 999) - (y.orden ?? 999)).forEach(p => {
        const u = Math.max(1, Number(p.unidades) || 1);
        out += [codDe(p), p.nombre, presDe(p) || "Unidad", L(p.precio), u > 1 ? L(p.precio / u) + " c/" + unidadDe(p) + (soloPres(p) ? " (no se vende suelto)" : "") : "—", p.activo === false ? "No" : "Sí", p.notaAgente || ""].join(" | ") + "\n";
      });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["\ufeff" + out], {type: "text/plain;charset=utf-8"}));
      a.download = "chats-mhas-" + periodo.hastaFecha + "-" + periodo.dias + "d.txt"; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast(cantidad + " conversaciones descargadas del período elegido");
    } catch (e) { fallo(e, "descargar los chats"); }
    S.busy = false; draw();
  },

  async metaSemanal(){
    // Un solo archivo para Meta: Purchase (ventas) y Lead (potenciales). Los que solo preguntaron o no contestaron no se suben.
    const dias = Number(prompt("¿De cuántos días hacia atrás? (7 = la última semana)", "7"));
    if (!(dias > 0)) return;
    const lim = addDays(today(), -Math.round(dias)), limMs = new Date(lim + "T00:00:00").getTime();
    const telDe = t => { let x = String(t || "").replace(/\D/g, ""); if (x.length === 8) x = "504" + x; return x.length === 11 && x.startsWith("504") ? x : ""; };
    const mailDe = e => { e = String(e || "").trim().toLowerCase(); return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e) ? e : ""; };
    const sinAc = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    const nom = t => { const p = sinAc(t).split(/\s+/).filter(Boolean); return [p[0] || "", p.slice(1).join(" ")]; };
    const ciudad = t => { const d = sinAc(t).toLowerCase(); return /san pedro|sps|s\.p\.s/.test(d) ? "San Pedro Sula" : /tegucigalpa|tgu/.test(d) ? "Tegucigalpa" : /choloma/.test(d) ? "Choloma" : /la lima/.test(d) ? "La Lima" : /villanueva/.test(d) ? "Villanueva" : /la ceiba/.test(d) ? "La Ceiba" : /tela/.test(d) ? "Tela" : ""; };
    const filas = [], vistos = new Set(), n = {venta: 0, potencial: 0, pregunto: 0, nocontesto: 0, valorVentas: 0, otros: 0};
    const ahora = Math.floor(Date.now() / 1000);
    const unix = f => typeof f === "number" ? Math.floor(f / 1000) : Math.floor(new Date(String(f).slice(0, 10) + "T12:00:00-06:00").getTime() / 1000);
    // Meta pide hora exacta (no futura) y valor mayor que 0: a contactos y leads sin monto se les pone L. 1.00
    const fila = (tel, email, nombre, dir, ev, fecha, valor, id) => { const [fn, ln] = nombre; const v = Number(valor) > 0 ? Number(valor) : 1; filas.push([tel, email, fn, ln, ciudad(dir), "hn", ev, String(Math.min(ahora, unix(fecha))), v.toFixed(2), "HNL", id]); };
    // Números del equipo y de prueba no se suben
    // Solo se suben clientes que escribieron al WhatsApp de MHAS (vienen de los anuncios o del agente)
    const deWhats = new Set(S.convs.map(x => telDe(x.tel || x.id)).filter(Boolean));
    const internos = new Set([...((S.ag && S.ag.numerosEquipo) || []), ...((S.ag && S.ag.numerosPrueba) || [])].map(telDe).filter(Boolean));
    S.busy = true; draw();
    try {
      // 1) Cotizaciones del periodo: facturadas = venta, el resto = potencial
      S.cot.filter(c => !c.eliminada && c.estado !== "anulada").forEach(c => {
        const cli = (c.cliente && c.cliente.id && S.cli.find(x => x.id === c.cliente.id)) || {};
        const tel = telDe((c.cliente && c.cliente.tel) || cli.tel), email = mailDe((c.cliente && c.cliente.email) || cli.email);
        if ((!tel && !email) || internos.has(tel)) return;
        if (!deWhats.has(tel)) { if ((c.fecha && c.fecha >= lim) || (c.estado === "facturada" && ((c.factura && c.factura.fecha) || c.fecha) >= lim)) n.otros++; return; }
        const nombre = nom(cli.contacto || (c.cliente && c.cliente.contacto) || ""), dir = cli.direccion || (c.cliente && c.cliente.direccion) || "";
        const ff = (c.factura && c.factura.fecha) || c.fecha;
        if (c.estado === "facturada" && ff && ff >= lim) { fila(tel, email, nombre, dir, "Purchase", ff, c.total, c.numero); n.venta++; n.valorVentas += Number(c.total) || 0; vistos.add(tel || email); }
        if (c.fecha && c.fecha >= lim) { fila(tel, email, nombre, dir, "Lead", c.fecha, c.total, c.numero + "-L"); if (c.estado !== "facturada") n.potencial++; vistos.add(tel || email); }
      });
      // 2) Chats de WhatsApp del periodo sin cotización
      for (const cv of S.convs.filter(x => (x.actualizado || 0) >= limMs)) {
        const tel = telDe(cv.tel || cv.id);
        if (!tel || vistos.has(tel) || internos.has(tel)) continue;
        vistos.add(tel);
        const fecha = ymd(new Date(cv.actualizado)), cli = S.cli.find(x => telDe(x.tel) === tel) || {};
        const nombre = nom(cli.contacto || cv.nombre || ""), dir = cli.direccion || "";
        if (cv.estado === "pide_persona" || cv.ultimaCotizacion) { fila(tel, "", nombre, dir, "Lead", cv.actualizado, 0, "W-" + tel + "-" + fecha); n.potencial++; continue; }
        const q = await getDocs(query(collection(db, "conversaciones", cv.id, "mensajes"), orderBy("ts", "asc"), limit(50)));
        const delCliente = q.docs.filter(d => d.data().de === "cliente").length;
        if (delCliente >= 2) n.pregunto++;
        else n.nocontesto++;
      }
    } catch (e) { S.busy = false; draw(); return fallo(e, "preparar el reporte"); }
    S.busy = false; draw();
    const resumen = "Últimos " + Math.round(dias) + " días:\n• Ventas: " + n.venta + " (L." + n.valorVentas.toLocaleString("es-HN", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ")\n• Potenciales: " + n.potencial + "\n• Solo preguntaron: " + n.pregunto + " (no se suben)\n• No contestaron: " + n.nocontesto + " (no se suben)\n• Cotizaciones de clientes que no escribieron por WhatsApp: " + n.otros + " (no se suben)";
    if (!filas.length) return alert(resumen + "\n\nNo hay nada para subir a Meta en este periodo.");
    filas.sort((a, b) => Number(a[7]) - Number(b[7]));
    const q = v => /[",\n]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : v;
    const csv = [["phone", "email", "fn", "ln", "ct", "country", "event_name", "event_time", "value", "currency", "order_id"]].concat(filas).map(r => r.map(q).join(",")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"})); a.download = "meta-semanal-" + today() + ".csv";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    alert(resumen + "\n\nArchivo descargado. Súbelo en Administrador de eventos → Agregar eventos → Subida de archivos.");
  },

const MARGEN_MIN = 25;
function datosMargen(p){
  const venta = r2((Number(p.precio) || 0) / 1.15), compra = compraDe(p), ganancia = r2(venta - compra);
  const minimoIsv = compra ? r2(compra / (1 - MARGEN_MIN / 100) * 1.15) : 0;
  return {venta, compra, ganancia, pct: venta && compra ? ganancia / venta * 100 : 0, minimoIsv, descMax: compra ? r2((Number(p.precio) || 0) - minimoIsv) : 0};
}

function margenTxt(venta, compra){

  return `<span style="color:${pct < MARGEN_MIN ? "var(--bad)" : "var(--ok)"};font-weight:700">Ganancia ${L(m)} · margen ${pct.toFixed(1)}%</span>`;

// Orden por familia: el producto nuevo queda después del último de su familia (prefijo del código: ROL, ETQ, EMP…)
const famDe = codigo => String(codigo || "").split("-")[0].toUpperCase();
function ordenParaNuevo(codigo){
  const fam = famDe(codigo), ords = S.prod.map(p => Number(p.orden ?? 999));
  const deFam = S.prod.filter(p => famDe(codDe(p)) === fam && Number(p.orden ?? 999) < 999).map(p => Number(p.orden));
  if (!deFam.length) return 999;
  const ult = Math.max(...deFam), sig = ords.filter(o => o > ult).reduce((a, b) => Math.min(a, b), Infinity);
  return isFinite(sig) && sig < 999 ? (ult + sig) / 2 : ult + 1;
}

    row.getCell(13).value = f.actualizado || null; row.getCell(14).value = f.activo ? "Sí" : "No";
    [6, 7, 8, 9, 11, 12].forEach(c => row.getCell(c).numFmt = L);

function leerCarrito(t){

  if (t.dataset.cpct != null) {

    if (t.value === "" || !isFinite(Number(t.value)) || !listaDe(i)) return null;

}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.m) { S.m = null; draw(); }
  if (e.key === "Enter" && e.target.matches("tr.click")) e.target.click();
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "as_txt") { e.preventDefault(); A.asEnviar(); }

  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("pc-in")) { e.preventDefault(); const ins = [...document.querySelectorAll(".pc-in")], i = ins.indexOf(e.target); if (ins[i + 1]) { ins[i + 1].focus(); ins[i + 1].select(); } }
  if (e.key === "Enter" && S.screen === "auth" && e.target.matches("#view input")) A.authGo();
});
document.addEventListener("input", e => {
  const t = e.target, k = t.dataset.k;
  if(t.dataset.ccosto!=null){const i=S.cart[Number(t.dataset.ccosto)],v=Number(t.value);if(i?.generico){if(t.value!==""&&Number.isFinite(v)&&v>0)i.costoU=v/vuDe(i).f;else delete i.costoU;}return;}
  if (t.dataset.pc != null) { S.pcEdit[t.dataset.pc] = t.value; return; }
  if (t.dataset.ctc) { const [n, campo] = t.dataset.ctc.split(":"), L1 = S.f.ce_ctcs || []; if (L1[Number(n)]) L1[Number(n)][campo] = t.value; return; }
  if (k === "pz_txt" && !S.f.pz_tipoManual) { const sel = $("#pz_tipo"); S.f.pz_tipo = tipoAuto(t.value); if (sel) sel.value = S.f.pz_tipo; }
  if (t.dataset.cq != null || t.dataset.cd != null || t.dataset.cpr != null || t.dataset.cpct != null) { if (leerCarrito(t)) refrescarCarrito(); return; }
  if (t.dataset.rep != null && S.m && S.m.rep) {
    const R = S.m.rep, r = R[Number(t.dataset.rep)]; if (r) r.pct = Math.max(0, Math.min(100, Number(t.value) || 0));
    const c = S.cot.find(x => x.id === S.m.id), d = c ? utilDe(c) : {neta: 0};
    R.forEach((x, n) => { const m = document.getElementById("repm" + n); if (m) m.textContent = L(r2(d.neta * (Number(x.pct) || 0) / 100)); });
    const s = r2(R.reduce((a, x) => a + (Number(x.pct) || 0), 0)), el = document.getElementById("repsum");
    if (el) { el.textContent = "Suma: " + s + "%" + (Math.abs(s - 100) > 0.05 ? " (debe ser 100%)" : ""); el.style.color = Math.abs(s - 100) > 0.05 ? "var(--bad)" : "var(--ok)"; }
    return;
  }
  if (k) {
    S.f[k] = t.type === "checkbox" ? t.checked : t.value;
    if (k === "flete") refrescarCarrito();
    if (k === "pe_cat" && S.m && !S.m.id && S.f.pe_codigo == null) { const o = $("#pe_codigo"); if (o) o.value = sugerirCodigo(t.value); }
    if (k === "cq" || k === "prq" || k === "invq" || k === "utq" || k === "flq") draw();
    if (k === "pe_precio" || k === "pe_unit" || k === "pe_unidades" || k === "pe_venta") {
      const un = Math.max(1, Number(($("#pe_unidades") || {}).value) || 1);
      const pon = (id, v) => { S.f[id] = v; const o = $("#" + id); if (o) o.value = v; };
      if (k === "pe_unit") pon("pe_precio", t.value === "" ? "" : r2(Number(t.value) * 1.15 * un));
      if (k === "pe_venta") pon("pe_precio", t.value === "" ? "" : r2(Number(t.value) * 1.15));
      const pr = Number(($("#pe_precio") || {}).value);
      if (k !== "pe_unit") { const v = Math.round(pr / 1.15 / un * 10000) / 10000; pon("pe_unit", isFinite(v) && pr ? v : ""); }
      if (k !== "pe_venta") pon("pe_venta", pr ? r2(pr / 1.15) : "");
    }
    if (k === "pe_precio" || k === "pe_unit" || k === "pe_unidades" || k === "pe_venta" || k === "pe_costo") prodMargen();
    if (k === "bq") draw();
    if (k === "cli_q") { const el = $("#cli_list"); if (el) el.innerHTML = cliListHtml(); }
    if (k === "pvu") { S.f.pmodo = clean(t.value) ? "o" : "u"; document.querySelectorAll('[data-a="pmodo"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === S.f.pmodo))); }
  }
});

/* ---------------- versión del sistema ----------------
   Cada vez que se sube un cambio, se sube el número aquí y en ventas/version.json (los dos iguales).
   Cada 5 minutos y al volver a abrir la app se revisa version.json: si hay una versión nueva, se recarga sola
   cuando no hay nada a medio llenar; si hay algo a medio llenar, sale una barra con el botón "Actualizar". */
const APP_VER = "2026-10-29d";
function algoSinGuardar(){
  if (S.prospectoForm || S.prospectoBuscando) return true;
  if (S.cart && S.cart.length) return true;
  if (S.compraForm || (S.compraCart && S.compraCart.length) || S.gastoForm) return true;
  if (S.m) return true;
  const a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  return [...document.querySelectorAll("input[data-k], textarea[data-k]")].some(e => e.offsetParent && e.type !== "date" && e.type !== "checkbox" && e.dataset.k !== "chat_dias" && !/(^|_)q$|buscar/i.test(e.dataset.k || "") && String(e.value || "").trim() !== "");
}
function irAVersion(v){
  try { const k = "mhas_recarga_" + v, n = Number(sessionStorage.getItem(k) || 0); if (n >= 2) return; sessionStorage.setItem(k, String(n + 1)); } catch (_) {}
  location.replace(location.pathname + "?v=" + encodeURIComponent(v) + location.hash);
}
function barraVersion(v){
  if (document.getElementById("barra_ver")) return;
  const d = document.createElement("div"); d.id = "barra_ver";
  d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#f0b93a;color:#111;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.3)";
  d.innerHTML = '<span>Hay una versión nueva del sistema. Guarde lo que está haciendo y actualice.</span>';
  const b = document.createElement("button"); b.textContent = "Actualizar"; b.style.cssText = "background:#111;color:#fff;border:0;border-radius:99px;padding:6px 16px;font-weight:700;cursor:pointer";
  b.onclick = () => irAVersion(v); d.appendChild(b); document.body.appendChild(d);
}
async function revisarVersion(){
  try {
    const r = await fetch("version.json?t=" + Date.now(), {cache: "no-store"}); if (!r.ok) return;
    const v = String((await r.json()).v || ""); if (!v || v <= APP_VER) return; // solo si version.json es MÁS nueva que esta página
    if (algoSinGuardar()) barraVersion(v); else irAVersion(v);
  } catch (_) {}
}
setInterval(revisarVersion, 5 * 60e3);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") revisarVersion(); });
setTimeout(revisarVersion, (window.__verT || 15e3));
